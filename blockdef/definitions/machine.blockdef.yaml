# The machine module's own functions, as generated from the MicroPython
# documentation. The classes that live in the same module (machine.Pin,
# machine.I2C, ...) are a separate problem: those blocks emit
# `machine.Pin.Pin.value(...)`, calling a method as though it were a module
# function, and no import would make them work.
#
# Three of the thirteen here -- enable_irq, lightsleep and time_pulse_us --
# never registered `import machine`, so a program built out of one of them
# alone died on a NameError. All thirteen do now.
#
# Three more (wake_reason, unique_id, rng) are value blocks that returned
# "machine.x()\n" -- a newline spliced into the middle of an expression, so
# `machine.rng() + 1` did not compile. Value blocks here cannot do that:
# the emitter adds the newline only to statements.

module: machine
colour: 0
url: https://docs.micropython.org/en/latest/library/machine.html
import: {line: "import machine", key: import_machine}

category:
  name: "machine"
  # esp32 has this category too, but inside a "blocks below need development"
  # XML comment, so it is not offered there.
  toolboxes: [esp32S2, esp32c3, esp32S3, otto-robot, esp8266, rpi_pico, rpi_pico_w,
              makernano, makerpi, AmadoBoard, stm32, default, 3pi_2040]

blocks:
  - type: machine_reset
    fn: reset
    label: " reset"
    tooltip: ".. function:: reset() Resets the device in a manner similar to pushing the external RESET button. "

  - type: machine_soft_reset
    fn: soft_reset
    label: " soft_reset"
    tooltip: ".. function:: soft_reset() Performs a soft reset of the interpreter, deleting all Python objects and resetting the Python heap. It tries to retain the method by which the user "

  - type: machine_reset_cause
    fn: reset_cause
    kind: value
    label: " reset_cause"
    tooltip: ".. function:: reset_cause() Get the reset cause. See :ref:`constants <machine_constants>` for the possibl e return values. "

  - type: machine_disable_irq
    fn: disable_irq
    label: " disable_irq"
    tooltip: ".. function:: disable_irq() Disable interrupt requests. Returns the previous IRQ state which should be considered an opaque value. "

  - type: machine_enable_irq
    fn: enable_irq
    label: []
    tooltip: ".. function:: enable_irq(state) Re-enable interrupt requests. The *state* parameter should be the value that was returned from the most "
    params:
      - {name: pIn, label: " enable_irq"}

  - type: machine_freq
