    label: " idle"
    tooltip: ".. function:: idle() Gates the clock to the CPU, useful to reduce power consumption at any time du ring "

  - type: machine_sleep
    fn: sleep
    label: " sleep"
    tooltip: ".. function:: sleep() .. note:: This function is deprecated, use `lightsleep()` instead with no arg uments. "

  - type: machine_lightsleep
    fn: lightsleep
    label: []
    tooltip: " "
    params:
