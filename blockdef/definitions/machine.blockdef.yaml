  - type: machine_unique_id
    fn: unique_id
    kind: value
    label: " unique_id"
    tooltip: ".. function:: unique_id() Returns a byte string with a unique identifier of a board/SoC. It will vary from a board/SoC instance to another, if underlying hardware allows. Length "

  - type: machine_time_pulse_us
    fn: time_pulse_us
    label: []
    tooltip: ".. function:: time_pulse_us(pin, pulse_level, timeout_us=1000000, /) Time a pulse on the given *pin*, and return the duration of the pulse in microseconds. The *pulse_level* argument should be 0 to time a low pulse "
    params:
