# The uzlib module, as generated from the MicroPython documentation.
#
# None of these blocks imported the module they call, so every program using
# one died on a NameError. They do now.

module: uzlib
colour: 0
import: {line: "import uzlib", key: import_uzlib}

category:
  name: "uzlib"
  # esp32 has these categories too, but inside a "blocks below need
  # development" XML comment, so they are not offered there.
  toolboxes: [esp32S2, esp32c3, esp8266, rpi_pico, rpi_pico_w, makernano, makerpi, AmadoBoard, stm32, default, 3pi_2040]

blocks:
  - type: uzlib_decompress
    label: []
    kind: value
    tooltip: ".. function:: decompress(data, wbits=0, bufsize=0, /) Return decompressed *data* as bytes. *wbits* is DEFLATE dictionary window size used during compression (8-15, the dictionary size is power of 2 of "
    url: "https://docs.micropython.org/en/latest/library/uzlib.html"
    code: "uzlib.decompress({pIn})"
    params:
      - {name: pIn, label: " decompress"}
