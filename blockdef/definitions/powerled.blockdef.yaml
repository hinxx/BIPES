# PWM-dimmable power LED module.
#
# The driver shipped as `led_single_power.py` while every generator emitted
# `import powerled`, so the install button put a file on the board under a
# name nothing imports. It is `powerled.py` here.
#
# Init wrapped the constructor in a try/except that left `powerled_led =
# None`, and all five other blocks then guarded against it and swallowed
# every RuntimeError. Gone: the LED exists or the traceback says why not.

module: powerled
class: PowerLED
instance: powerled_led
colour: 230
url: https://freakstudio.cn/node/019b88b8-4451-7065-92ee-d20e8165a0c2
import:
  - {line: "import powerled", key: import_powerled}

category:
  name: PowerLED
  library: powerled
  labels:
    - "Library: https://github.com/FreakStudioCN/GraftSense-Drivers-MicroPython"
    - PowerLED PWM Dimmable LED Module
  toolboxes: [rpi_pico]

blocks:
  - type: powerled_init
    constructor: true
    label:
      - {image: {src: media/powerled.png, width: 55, height: 55}}
      - Init PowerLED (PWM)
    tooltip: Init PowerLED with PWM control (1-1000 Hz frequency)
    params:
      - {name: pin, label: LED Pin, type: Number, pin: true, default: 25,
         align: right, keyword: pin}
      - {name: pwm_freq, label: PWM Frequency (Hz), type: Number, default: 1000,
         align: right, keyword: pwm_freq}

  - {type: powerled_on, fn: on, label: PowerLED Turn On (Full Brightness),
     tooltip: Turn on PowerLED at maximum brightness}
  - {type: powerled_off, fn: off, label: PowerLED Turn Off,
     tooltip: Turn off PowerLED}
  - {type: powerled_toggle, fn: toggle, label: PowerLED Toggle State,
     tooltip: Toggle PowerLED on/off state}

  - type: powerled_set_brightness
    fn: set_brightness
    label: PowerLED Set Brightness
    tooltip: Set PowerLED brightness (0=off, 1023=full)
    params:
      - {name: duty, label: Brightness (0-1023), type: Number, default: 512, align: right}

  - {type: powerled_get_state, fn: get_state, kind: value,
     label: PowerLED Get State (On=True),
     tooltip: "Check if PowerLED is on (returns True/False)"}
