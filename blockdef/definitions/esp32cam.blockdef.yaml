# OV2640 camera on the ESP32-CAM board, plus its two on-board LEDs.

module: camera
colour: 0
url: www.bipes.net.br
import: []

category:
  name: Camera (ESP32CAM)
  # No `examples:`: ui/examples/esp32cam.xml does not exist.
  labels:
    - OV2640 Camera on ESP32-CAM Board
    - "More info: https://rafaelaroca.wordpress.com/2021/07/15/esp32-camera-micropython-and-no-esptool/"
  toolboxes: [esp32, esp32-basic, esp32c3, esp32S2, AmadoBoard]

blocks:
  - type: esp32_cam_init
    label: ESP32-CAM Init
    tooltip: Init ESP32-CAM camera
    import: {line: "import camera", key: import_camera}
    code: "camera.init(1)"

  - type: esp32_cam_capture
    kind: value
    label: ESP32-CAM capture photo
    tooltip: Take photo with ESP32-CAM camera
    import: {line: "import camera", key: import_camera}
    code: "camera.capture()"

  # Both LEDs are on fixed pins of the ESP32-CAM board: red on 33, flash on 4.
  - type: esp32_cam_red_led
    label: Control ESP32-CAM red LED
    tooltip: Control ESP32-CAM Red LED
    url: bipes.net.br
    colour: 230
    import: &gpio_set
      - {line: "from machine import Pin", key: import_pin}
      - key: gpio_set
        line: |-
          def gpio_set(pin,value):
            if value >= 1:
              Pin(pin, Pin.OUT).on()
            else:
              Pin(pin, Pin.OUT).off()
    code: "gpio_set(33, {value})"
    params:
      - {name: value, label: to, default: 1, align: right}

  - type: esp32_cam_white_led
    label: Control ESP32-CAM flashlight
    tooltip: Control ESP32-CAM White LED (flashlight)
    url: bipes.net.br
    colour: 230
    import: *gpio_set
    code: "gpio_set(4, {value})"
    params:
      - {name: value, label: to, default: 1, align: right}
