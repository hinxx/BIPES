  - {type: r60abd1_query_sleep_status, kind: value, label: Query R60ABD1 Sleep Status,
     tooltip: Query R60ABD1 Sleep Status, code: "{instance}.query_sleep_status()[1]"}
  - {type: r60abd1_query_awake_duration, kind: value, label: Query R60ABD1 Awake Duration,
     tooltip: Query R60ABD1 Awake Duration, code: "{instance}.query_awake_duration()[1]"}
  - {type: r60abd1_query_light_sleep_duration, kind: value, label: Query R60ABD1 Light Sleep Duration,
