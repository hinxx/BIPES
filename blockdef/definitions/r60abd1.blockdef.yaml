         options: [{ON: "ON"}, {OFF: "OFF"}],
         emit: {ON: enable_breath_monitor, OFF: disable_breath_monitor}}
  - type: r60abd1_control_breath_waveform
    label: []
    tooltip: Set R60ABD1 Breath Waveform Report
    code: "{instance}.{BREATH_WAVE_STATE}()"
    params:
      - {name: BREATH_WAVE_STATE, label: Set R60ABD1 Breath Waveform Report, kind: dropdown,
         options: [{ON: "ON"}, {OFF: "OFF"}],
