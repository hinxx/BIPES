    code: "{instance}.{HR_STATE}()"
    params:
      - {name: HR_STATE, label: Set R60ABD1 Heart Rate Monitor, kind: dropdown,
         options: [{ON: "ON"}, {OFF: "OFF"}],
         emit: {ON: enable_heart_rate_monitor, OFF: disable_heart_rate_monitor}}
  - type: r60abd1_control_hr_waveform
