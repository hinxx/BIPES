  - {type: r60abd1_query_sleep_anomaly, kind: value, label: Query R60ABD1 Sleep Anomaly,
     tooltip: Query R60ABD1 Sleep Anomaly, code: "{instance}.query_sleep_anomaly()[1]"}
  - {type: r60abd1_query_sleep_statistics, kind: value, label: Query R60ABD1 Sleep Statistics,
     tooltip: Query R60ABD1 Sleep Statistics, code: "{instance}.query_sleep_statistics()[1]"}
  - {type: r60abd1_query_sleep_quality_level, kind: value, label: Query R60ABD1 Sleep Quality Level,
     tooltip: Query R60ABD1 Sleep Quality Level, code: "{instance}.query_sleep_quality_level()[1]"}
  - type: r60abd1_control_presence
    label: []
    tooltip: Set R60ABD1 Human Presence
    code: "{instance}.{PRESENCE_STATE}()"
    params:
      - {name: PRESENCE_STATE, label: Set R60ABD1 Human Presence, kind: dropdown,
         options: [{ON: "ON"}, {OFF: "OFF"}],
         emit: {ON: enable_human_presence, OFF: disable_human_presence}}
  - type: r60abd1_control_heart_rate
