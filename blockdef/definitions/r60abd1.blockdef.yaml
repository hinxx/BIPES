  - {type: r60abd1_query_sleep_quality_score, kind: value, label: Query R60ABD1 Sleep Quality Score,
     tooltip: Query R60ABD1 Sleep Quality Score, code: "{instance}.query_sleep_quality_score()[1]"}
  - {type: r60abd1_query_sleep_comprehensive, kind: value, label: Query R60ABD1 Sleep Comprehensive Status,
