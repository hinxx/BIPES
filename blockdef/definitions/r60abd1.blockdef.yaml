  - {type: r60abd1_query_breath_wave_switch, kind: value, label: Query R60ABD1 Breath Waveform Switch,
     tooltip: Query R60ABD1 Breath Waveform Switch, code: "{instance}.query_breath_waveform_report_switch()[1]"}
  - {type: r60abd1_query_breath_waveform, kind: value, label: Query R60ABD1 Breath Waveform,
     tooltip: Query R60ABD1 Breath Waveform, code: "{instance}.query_breath_waveform()[1]"}
  - {type: r60abd1_query_sleep_switch, kind: value, label: Query R60ABD1 Sleep Monitor Switch,
     tooltip: Query R60ABD1 Sleep Monitor Switch, code: "{instance}.query_sleep_monitor_switch()[1]"}
  - {type: r60abd1_query_struggle_switch, kind: value, label: Query R60ABD1 Struggle Monitor Switch,
     tooltip: Query R60ABD1 Struggle Monitor Switch, code: "{instance}.query_abnormal_struggle_switch()[1]"}
  - {type: r60abd1_query_struggle_status, kind: value, label: Query R60ABD1 Struggle Status,
     tooltip: Query R60ABD1 Struggle Status, code: "{instance}.query_abnormal_struggle_status()[1]"}
  - {type: r60abd1_query_struggle_sensitivity, kind: value, label: Query R60ABD1 Struggle Sensitivity,
     tooltip: Query R60ABD1 Struggle Sensitivity, code: "{instance}.query_struggle_sensitivity()[1]"}
  - {type: r60abd1_query_no_person_switch, kind: value, label: Query R60ABD1 No Person Timing Switch,
     tooltip: Query R60ABD1 No Person Timing Switch, code: "{instance}.query_no_person_timing_switch()[1]"}
  - {type: r60abd1_query_no_person_duration, kind: value, label: Query R60ABD1 No Person Duration,
     tooltip: Query R60ABD1 No Person Duration, code: "{instance}.query_no_person_timing_duration()[1]"}
  - {type: r60abd1_query_sleep_end_duration, kind: value, label: Query R60ABD1 Sleep End Duration,
     tooltip: Query R60ABD1 Sleep End Duration, code: "{instance}.query_sleep_end_duration()[1]"}
  - {type: r60abd1_query_no_person_status, kind: value, label: Query R60ABD1 No Person Timing Status,
     tooltip: Query R60ABD1 No Person Timing Status, code: "{instance}.query_no_person_timing_status()[1]"}
  - {type: r60abd1_query_bed_status, kind: value, label: Query R60ABD1 Bed Status,
