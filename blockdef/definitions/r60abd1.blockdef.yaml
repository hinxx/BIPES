         options: [{ON: "ON"}, {OFF: "OFF"}],
         emit: {ON: enable_no_person_timing, OFF: disable_no_person_timing}}
  - type: r60abd1_set_low_breath_threshold
    fn: set_low_breath_threshold
    label: Set R60ABD1 Low Breath Threshold
    tooltip: Set the low-breathing alarm threshold
    params:
      - {name: threshold, label: Value (10-20), type: Number, default: 10, align: right}

  - type: r60abd1_set_struggle_sensitivity
    fn: set_struggle_sensitivity
    label: Set R60ABD1 Struggle Sensitivity
    tooltip: Set how readily the struggle alarm triggers
    params:
      - {name: SENSITIVITY, label: Level, kind: dropdown,
         options: [{Low (0): "0"}, {Medium (1): "1"}, {High (2): "2"}]}

  - type: r60abd1_set_no_person_duration
    fn: set_no_person_timing_duration
    label: Set R60ABD1 No Person Duration
    tooltip: Set how long an empty room is timed for
    params:
      - {name: duration, label: "Minutes (30-180, step 10)", type: Number,
         default: 30, align: right}

  - type: r60abd1_set_sleep_end_duration
    fn: set_sleep_end_duration
    label: Set R60ABD1 Sleep End Duration
    tooltip: Set how long without a person ends a sleep session
    params:
      - {name: duration, label: Minutes (5-120), type: Number, default: 120,
         align: right}

  - type: r60abd1_close
    fn: close
    label: Close R60ABD1 Sensor
    tooltip: Stop the parse timer and release the sensor
