# The nested category under `scikit-learn` (see sklearn.blockdef.yaml).

module: sklearn
colour: 60
url: http://www.bipes.net.br
import: {key: import_random_forest_classifier,
         line: "from sklearn.ensemble import RandomForestClassifier"}

category:
  name: classifier
  toolboxes: [linux]

blocks:
  - type: randomforestclassifier
    kind: value
    label: [{text: Random Forest Classifier, align: centre}]
    tooltip: randomforestclassifier
    code: "RandomForestClassifier(random_state={random_state})"
    params:
      - {name: random_state, label: random_state, default: 0, align: right}
