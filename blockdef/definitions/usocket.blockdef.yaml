# The usocket module. Every one of the eighteen `socket.*` blocks emitted
# `usocket.socket.bind(…)` -- the method called on the *class*, not on a
# socket -- and `usocket_socket`, the block that makes one, threw the socket
# away: it emitted `usocket.socket(…)` as a statement and assigned it to
# nothing. Nineteen of the twenty-two also did it without `import usocket`.
#
# The category already contains its own constructor, so this is the same
# arrangement every hardware family here uses: the constructor assigns to
# `usocket_sock` and the methods are called on it. The three module-level
# functions keep their `usocket.` prefix.

module: usocket
class: socket
instance: usocket_sock
colour: 0
url: https://docs.micropython.org/en/latest/library/usocket.html
import: {key: import_usocket, line: "import usocket"}

category:
  name: usocket
  toolboxes: [3pi_2040, AmadoBoard, default, esp32, esp32S2, esp32c3, esp32S3,
              otto-robot, esp8266, makernano, makerpi, rpi_pico, rpi_pico_w,
              stm32]

