# Clock frequency, reset, and the reset-cause constants.
#
# Every block here is a plain `machine` call or constant, and the converted
# `machine` category is a mirror of the same module, so the two overlapped.
# Counted properly the overlap is **two pairs, not seven**: `reset` and
# `machine_reset` are both `machine.reset()`, and `get_freq` and `machine_freq`
# are both `machine.freq()`. The rest only looked like duplication --
# `set_freq` is `machine.freq(n)` and nothing in `machine` sets the frequency,
# and the four `reset_cause_*` constants are what you *compare*
# `machine_reset_cause` against, so a program wanting "did we wake from
# deepsleep" needs one of each.
#
# **Which of each pair to keep was the decision BACKLOG.md was holding, and it
# is the two here.** They emit the same Python, so the tie breaks on the label:
# this category says "Get CPU Clock Frequency" and "reset" where the mirror,
# built from the docs, says " freq" and " reset" -- a leading space and the
# method name. The `machine` category lists these two instead of its own now,
# as `external:` entries, so it keeps both rows and nothing is duplicated; the
# two it dropped are `offered: false` there, so a saved program holding one
# still loads. Nothing loses a capability: `CPU` is offered on all fifteen
# toolboxes and `machine` on thirteen of the same fifteen.

module: machine
colour: 230
url: http://www.bipes.net.br
import: {key: import_machine, line: "import machine"}

category:
  name: CPU
  toolboxes: [3pi_2040, AmadoBoard, default, esp32, esp32-basic, esp32S2, esp32c3,
              esp32S3, otto-robot, esp8266, makernano, makerpi, rpi_pico, rpi_pico_w,
              stm32]

blocks:
  # The one thing that differs between boards, and two of them were wrong: the
  # generic `default` board and the `stm32` Nucleo both announced an ESP8266.
  # That was the last of the board decisions BACKLOG.md was holding, and it is
  # a typo rather than a judgement -- a Nucleo is an STM32 and the generic
  # board is not any particular chip, so they say so.
  - {label: Raspberry Pi Pico CPU,
     boards: [3pi_2040, makernano, makerpi, rpi_pico, rpi_pico_w]}
  - {label: ESP32 CPU, boards: [AmadoBoard, esp32, esp32-basic, esp32S2, esp32c3,
                                esp32S3, otto-robot]}
  - {label: ESP8266 CPU, boards: [esp8266]}
  - {label: STM32 CPU,   boards: [stm32]}
  - {label: CPU,         boards: [default]}

  - type: get_freq
    kind: value
    label: Get CPU Clock Frequency
    tooltip: Get current CPU Clock Frequency
    code: "machine.freq()"

  # The tooltip said "Set ESP8266 CPU Clock Frequency" on all thirteen boards
  # that offered it, eleven of which are not one.
  - type: set_freq
    label: Set CPU Clock Frequency
    tooltip: Set the CPU clock frequency, in hertz.
    code: "machine.freq({freq})"
    params:
      - {name: freq, label: Frequency (Hz), type: Number, default: 160000000}

  - type: reset
    colour: 0
    label: reset
    tooltip: Reset Device
    url: www.bipes.net.br
    code: "machine.reset()"

  - {type: machine_unique_id,   external: true}
  - {type: machine_reset_cause, external: true}

  # Constants, not calls. No tooltip on any of the four, as before.
  - {type: reset_cause_soft, kind: value, label: "Cause: soft reset",
     code: "machine.SOFT_RESET"}
  - {type: reset_cause_hard, kind: value, label: "Cause: hard reset",
     code: "machine.HARD_RESET"}
  - {type: reset_cause_wdt, kind: value, label: "Cause: reset by watchdog timer",
     code: "machine.WDT_RESET"}
  - {type: reset_cause_deep, kind: value, label: "Cause: woke up from deepsleep",
     code: "machine.DEEPSLEEP_RESET"}
