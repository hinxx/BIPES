# machine.UART. A platform peripheral, not a driver: nothing to install.
#
# Two block sets had drifted apart -- seven boards offered `uart_read_into` and
# five offered `uart_any`. Both work anywhere, so every board now has both.

module: machine
instance: uart
colour: 135
import: []

category:
  name: UART
  labels: [UART Serial Port]
  # esp32-basic deliberately has no UART category.
  toolboxes: [esp32, esp32c3, esp32S3, otto-robot, esp32S2, esp8266, rpi_pico,
              rpi_pico_w, makernano, makerpi, AmadoBoard, stm32, default, 3pi_2040]
  # UART pins per board -- the table in blockdef/README.md. `stm32` and
  # `default` are left out: no device on either gives a pinout, so both sockets
  # read "not defined" there whatever is written here.
  defaults:
    esp32:       {tx: 17, rx: 16}
    AmadoBoard:  {tx: 17, rx: 16}
    esp32c3:     {tx: 21, rx: 20}
    esp32S2:     {tx: 17, rx: 16}
    esp32S3:     {tx: 43, rx: 44}
    otto-robot:  {tx: 17, rx: 16}
    esp8266:     {tx: 1,  rx: 3}
    rpi_pico:    {tx: 0,  rx: 1}
    rpi_pico_w:  {tx: 0,  rx: 1}
    3pi_2040:    {tx: 0,  rx: 1}
    makernano:   {tx: 0,  rx: 1}
    makerpi:     {tx: 0,  rx: 1}

blocks:
  - type: uart_init
    label: Init UART Serial Port
    tooltip: ""
    import:
      - {line: "from machine import UART", key: import_machine_uart}
      - {line: "from machine import Pin", key: import_pin}
    code: "{instance} = UART({port}, baudrate={baud}, tx=Pin({tx}), rx=Pin({rx}))"
    params:
      - {name: port, label: "Port:",      type: Number, default: 0,    align: right}
      - {name: baud, label: "Baud rate:", type: Number, default: 9600, align: right}
      - {name: tx,   label: "TX Pin:",    type: Number, pin: true,     align: right, default: 17}
      - {name: rx,   label: "RX Pin:",    type: Number, pin: true,     align: right, default: 16}

  - type: uart_write
    fn: write
    label: Send data to UART
    tooltip: ""
    params:
      - {name: buf, label: "Data:", type: String, default: hello, align: right}

  - type: uart_read
    kind: value
    label: Read data from UART
    tooltip: ""
    code: "{instance}.read({s}).decode()"
    params:
      - {name: s, label: "Bytes to read:", type: Number, default: 1, align: right}

  - type: uart_read_into
    kind: value
    label: Read from UART into a Buffer
    tooltip: ""
    # The hand-written generator read an input called 'buffer'; the block's
    # input is called 'b', so it always read nothing and emitted readinto().
    code: "{instance}.readinto({b})"
    params:
      - {name: b, label: "Destination Buffer:", type: Number, align: right}

  - type: uart_readline
    kind: value
    label: Read one line from UART
    tooltip: ""
    code: "{instance}.readline().decode()"

  - type: uart_read_all
    kind: value
    label: Read all data from UART
    tooltip: ""
    code: "{instance}.read().decode()"

  - type: uart_any
    fn: any
    kind: value
    label: Check to see if the uart has data
    tooltip: ""
