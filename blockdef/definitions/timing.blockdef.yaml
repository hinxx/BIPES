# Delays, tick counters, the real-time clock and the hardware timer. Fourteen
# boards and, before this, six different block sets and two spellings of the
# category name.
#
# The name is settled first: eleven boards wrote `%{BKY_CAT_TIMING}` and three
# wrote `Timing`, so those three showed English whatever language the IDE was
# in. `CAT_TIMING` is translated in all eleven language files, so all fourteen
# use the key now -- the same call already made for Ultrasound, Character
# Display, DHT, IMU and RC Servo.
#
# What the block *set* should be stays each board's business, which is what
# `boards:` is for; every board comes out offering exactly what it offered,
# with two exceptions:
#
# * `default` and `stm32` listed `set_rtc` and `get_rtc`, **which no file
#   defines** -- two blanks in the flyout. Both boards have the surviving pair
#   now: what those two entries were reaching for is `from machine import RTC`
#   and `rtc.datetime(...)`, which is port-neutral MicroPython and works on a
#   Nucleo as well as on an ESP32.
# * `esp32_set_rtc`/`esp32_get_rtc` and `esp8266_set_rtc`/`esp8266_get_rtc` are
#   **the same two blocks twice**. The get pair is identical down to the
#   message key; the set pair differs only in that the ESP32 one had its labels
#   frozen in English where the ESP8266 one used the `set_rtc`/`year`/`month`/…
#   keys, which are translated in all eleven languages. Both now use the keys,
#   so the ESP32 boards get the translation they were missing.
#
#   **Which of the two ids to keep was the decision BACKLOG.md was holding, and
#   it is the `esp32_` pair.** Neither block is port-specific -- both are
#   `machine.RTC` and `rtc.datetime(...)` -- so the id is a label on a drawer,
#   and the one already used by seven boards costs fewer saved programs than
#   the one used by one. The `esp8266_` pair is `offered: false` rather than
#   deleted: every esp8266 program that holds one still loads and still
#   generates the same Python, it just cannot be dragged fresh. The surviving
#   pair is offered on all ten boards that have a `machine.RTC` at all -- the
#   eight that had either pair, plus `default` and `stm32` above.
#
# Two blocks here stay hand-written and appear as `external:` entries: `timer`
# because it is not a declaration (it walks the workspace for the variables its
# callback has to declare `global`), and `utime.deadline` because its id field
# defaults to a *random* number, which is a method, not a value.
#
# `utime.vars` was a third until `variants:` arrived: it emits CircuitPython on
# the ESP32S2 and MicroPython everywhere else, which the format can now say.

module: utime
colour: 230
import: []

category:
  name: "%{BKY_CAT_TIMING}"
  toolboxes: [3pi_2040, AmadoBoard, arduino, default, esp32, esp32-basic, esp32S2,
              esp32c3, esp32S3, otto-robot, esp8266, makernano, makerpi, rpi_pico,
              rpi_pico_w, stm32]

blocks:
  - {label: "%{BKY_CAT_TIMING}", boards: [3pi_2040, AmadoBoard, default, esp32,
                                          esp32-basic, esp32S2, esp32c3, esp32S3,
                                          otto-robot, esp8266, makernano, makerpi,
                                          rpi_pico, rpi_pico_w, stm32]}
  - {label: Snek Timing, boards: [arduino]}

  # Snek has its own runtime and its own `time`, so these two register no
  # import -- as they did not before.
  - type: snek_delay
    label: []
    tooltip: Delay processing in seconds
    url: http://www.bipes.net.br/
    boards: [arduino]
    code: "time.sleep({time})"
    params:
      - {name: time, label: "Snek: delay seconds", type: Number, default: 1}

  - type: snek_uptime
    kind: value
    # "Sneck" in the original, on the one board that offers it.
    label: [{text: "Snek: time counter", field: MSG_GET_MS}]
    tooltip: Get monotonic time counter
    url: http://www.bipes.net.br
    boards: [arduino]
    code: "time.monotonic()"

  - type: delay
    inline: true
    label: []
    tooltip: Delay for given number, should be positive or 0.
    url: https://docs.micropython.org/en/latest/library/utime.html#utime.sleep
    boards: [3pi_2040, AmadoBoard, default, esp32, esp32-basic, esp32S2, esp32c3,
             esp32S3, otto-robot, esp8266, makernano, makerpi, rpi_pico, rpi_pico_w,
             stm32]
    import: {key: import_time, line: "import time"}
    code: "time.{SCALE}({TIME})"
    params:
      - {name: TIME, label: {msg: block_delay}, default: 1}
      - name: SCALE
        kind: dropdown
        options:
          - {label: {msg: seconds},      value: sleep}
          - {label: {msg: milliseconds}, value: sleep_ms}
          - {label: {msg: microseconds}, value: sleep_us}

  - type: delay_ms
    label: []
    tooltip: Delay processing in milliseconds
    url: http://www.bipes.net.br/
    boards: [3pi_2040, default, makernano, makerpi, rpi_pico, rpi_pico_w, stm32]
    import: {key: import_time, line: "import time"}
    code: "time.sleep_ms({time})"
    params:
      - {name: time, label: delay milliseconds, type: Number, default: 1}

  - type: delay_us
    label: []
    tooltip: Delay processing in microseconds
    url: http://www.bipes.net.br/
    boards: [3pi_2040, default, makernano, makerpi, rpi_pico, rpi_pico_w, stm32]
    import: {key: import_time, line: "import time"}
    code: "time.sleep_us({time})"
    params:
      - {name: time, label: delay microseconds, type: Number, default: 1}

  - type: ticks_ms
    kind: value
    label: [{text: Get milliseconds counter, field: MSG_GET_MS}]
    tooltip: Get millisecond counter
    url: http://www.bipes.net.br
    boards: [3pi_2040, default, makernano, makerpi, rpi_pico, rpi_pico_w, stm32]
    import: {key: import_time, line: "import time"}
    code: "time.ticks_ms()"

  # Both halves of this block were broken. It returned "time.ticks_diff(…)\n"
  # as a *value*, splicing a newline into whatever expression it was plugged
  # into, and it then stripped newlines back out of the values plugged into
  # itself -- someone patching the symptom of `ticks_ms`, the block right above
  # it, doing the same thing. Neither is possible now. Six of the seven
  # toolboxes also gave it no shadows, so it emitted `time.ticks_diff(,)`.
  - type: ticks_diff
    kind: value
    label: [{text: Compute time difference, field: DIFF_TS}]
    tooltip: Compute time difference
    url: bipes.net.br
    boards: [3pi_2040, default, makernano, makerpi, rpi_pico, rpi_pico_w, stm32]
    import: {key: import_time, line: "import time"}
    code: "time.ticks_diff({end}, {start})"
    params:
      - {name: end,   label: end,   type: Number, default: 1, align: right}
      - {name: start, label: start, type: Number, default: 1, align: right}

  # The ESP32S2 runs CircuitPython, which has `time.monotonic()` and none of
  # utime's tick counters, so the dropdown means nothing there -- which is
  # what the hand-written generator did too, and now says so in one place.
  - type: "utime.vars"
    kind: value
    inline: true
    label: []
    tooltip: Returns a counter in the defined scale, only integer values.
    url: https://docs.micropython.org/en/latest/library/utime.html#utime.ticks_ms
    boards: [AmadoBoard, esp32, esp32-basic, esp32S2, esp32c3, esp32S3, otto-robot,
             esp8266]
    variants:
      - device: ESP32S2
        import: {key: import_time, line: "import time"}
        code: "time.monotonic()"
      - import: {key: import_utime, line: "import utime"}
        code: "utime.{VARS}()"
    params:
      - name: VARS
        label: get
        suffix: counter
        kind: dropdown
        options:
          - {seconds: time}
          - {milliseconds: ticks_ms}
          - {microseconds: ticks_us}
          - {nanoseconds: time_ns}
          - {"cpu ticks": ticks_cpu}

  - type: utime.ticks_add
    kind: value
    inline: true
    label: []
    tooltip: Offset ticks value by a given number, which can be either positive or negative. Must be same scale in milliseconds, microseconds or cpu ticks.
    url: https://docs.micropython.org/en/latest/library/utime.html#utime.ticks_add
    boards: [AmadoBoard, esp32, esp32-basic, esp32S2, esp32c3, esp32S3, otto-robot,
             esp8266]
    import: {key: import_utime, line: "import utime"}
    code: "utime.ticks_add({TIME1}, {TIME2})"
    params:
      - {name: TIME1, label: sum time, plug: {type: "utime.vars", shadow: true}}
      - {name: TIME2, label: by, default: 100}

  # Only esp32 gave this one anything to work with; the other five left both
  # sockets empty, so it emitted `utime.ticks_diff(,)`.
  - type: utime.ticks_diff
    kind: value
    inline: false
    label: []
    tooltip: Measure ticks difference between values Must be same scale in milliseconds, microseconds or cpu ticks.
    url: https://docs.micropython.org/en/latest/library/utime.html#utime.ticks_diff
    boards: [AmadoBoard, esp32, esp32-basic, esp32S2, esp32c3, esp32S3, otto-robot,
             esp8266]
    import: {key: import_utime, line: "import utime"}
    code: "utime.ticks_diff({TIME1}, {TIME2})"
    params:
      - {name: TIME1, label: time difference from,
         plug: {type: "utime.vars", shadow: true}}
      - {name: TIME2, label: by, default: 100, align: right}

  # The one pair, on every board that has a `machine.RTC`. See the head of the
  # file for why these two ids and not the `esp8266_` two below.
  - type: esp32_set_rtc
    label: [{msg: set_rtc, field: SET_RTC}]
    tooltip: Set RTC value
    url: bipes.net.br
    boards: [AmadoBoard, default, esp32, esp32-basic, esp32S2, esp32c3,
             esp32S3, otto-robot, esp8266, stm32]
    import: &rtc
      - {key: import_rtc,     line: "from machine import RTC"}
      - {key: import_rtc_def, line: "rtc = RTC()"}
    code: &set_rtc "rtc.datetime(({year},{month},{day},0,{hour},{minute},{second},0))"
    params: &set_rtc_params
      - {name: year,   label: {msg: year},   type: Number, default: 2026, align: right}
      - {name: month,  label: {msg: month},  type: Number, default: 1,    align: right}
      - {name: day,    label: {msg: day},    type: Number, default: 1,    align: right}
      - {name: hour,   label: {msg: hour},   type: Number, default: 0,    align: right}
      - {name: minute, label: {msg: minute}, type: Number, default: 0,    align: right}
      - {name: second, label: {msg: second}, type: Number, default: 0,    align: right}

  - type: esp32_get_rtc
    kind: value
    label: [{msg: get_rtc, field: MSG_GET_RTC}]
    tooltip: Get RTC value
    url: http://www.bipes.net.br
    boards: [AmadoBoard, default, esp32, esp32-basic, esp32S2, esp32c3,
             esp32S3, otto-robot, esp8266, stm32]
    import: *rtc
    code: &get_rtc "rtc.datetime()"

  # Superseded by the pair above, which emits the same Python. Kept so an
  # esp8266 program saved before now still loads.
  - type: esp8266_set_rtc
    offered: false
    label: [{msg: set_rtc, field: SET_RTC}]
    tooltip: Set RTC value
    url: bipes.net.br
    import: *rtc
    code: *set_rtc
    params: *set_rtc_params

  - type: esp8266_get_rtc
    offered: false
    kind: value
    label: [{msg: get_rtc, field: MSG_GET_RTC}]
    tooltip: Get RTC value
    url: http://www.bipes.net.br
    import: *rtc
    code: *get_rtc

  - {type: timer, external: true, boards: [3pi_2040, AmadoBoard, default, esp32,
                                           esp32-basic, esp32S2, esp32c3, esp32S3,
                                           otto-robot, esp8266, makernano, makerpi,
                                           rpi_pico, rpi_pico_w, stm32]}

  - type: utime.deadline
    external: true
    boards: [AmadoBoard, esp32, esp32-basic, esp32S2, esp32c3, esp32S3, otto-robot,
             esp8266]
    params:
      - {name: TIME, default: 100}

  # `pico_stop_timer` had **no generator at all** -- a real statement block,
  # offered by no toolbox, that a saved program from before could still hold.
  # `workspaceToCode` throws on a block Python does not know, and takes the
  # whole program's code with it: "Language "Python" does not know how to
  # generate code for block type "pico_stop_timer"". It stops the timer
  # `pico_timer` starts, which is `tim = Timer()`, so it deinits that.
  # `offered: false`, because no toolbox has ever listed it and whether the
  # Pico boards should offer a timer pair is a decision about those boards.
  - type: pico_stop_timer
    offered: false
    colour: 135
    label: "RPI Pico Stop Timer "
    tooltip: ""
    url: ""
    import: {key: import_timer, line: "from machine import Timer"}
    code: "tim.deinit()"

  # The timer it stops. Also offered by no toolbox, and the same shape as
  # `timer` above without the workspace walk -- so unlike `timer` it is a
  # declaration, and here it is.
  #
  # It is the Pico's *one* timer: the object is `tim` and the callback is
  # `timerFunc`, both fixed names, so a second one of these blocks in a
  # workspace re-inits the same timer with the same function. `timer` and
  # `stop_timer` above are the numbered pair. Left as it is -- which of the
  # two a Pico should offer is a decision about the board, and today neither
  # is offered.
  #
  # One change: the interval was a *text* field, so typing a word in it
  # emitted `period=every 5s`. It is a number field, like `stop_timer`'s. The
  # generator also read a `timerNumber` field the block does not have, and
  # never used what it got (`undefined`).
  - type: pico_timer
    offered: false
    colour: 135
    label: []
    tooltip: ""
    url: ""
    import:
      - {key: import_timer, line: "from machine import Timer"}
      - {key: pico_timer_object, line: "tim = Timer()"}
      - key: pico_timer_callback
        line: |-

          #Timer Function Callback
          def timerFunc(t):
          {statements}
    code: "tim.init(period={interval}, mode=Timer.PERIODIC, callback=timerFunc)"
    params:
      - {name: interval, label: "RPI Pico Timer  Interval (ms): ", kind: number,
         default: 1000}
      - {name: statements, kind: statements}

  # `delay_old` and `delay` do the same thing and no toolbox lists either
  # spelling of the older one.
  - type: delay_old
    offered: false
    label: []
    tooltip: Delay processing in seconds
    url: http://www.bipes.net.br/
    import: {key: import_time, line: "import time"}
    code: "time.sleep({time})"
    params:
      - {name: time, label: delay seconds, type: Number}

  # `deep_sleep` is `machine.deepsleep(ms)`, the portable spelling, and no board
  # offered it; `deep_sleep8266` below is the ESP8266's RTC-alarm spelling, and
  # eleven boards offered that. **Which of the pair a board should offer was the
  # decision BACKLOG.md was holding, and it goes by what the board's port has**:
  # the ten that are not an ESP8266 take this one, and the ESP8266 keeps its.
  # `machine.deepsleep([time_ms])` is the generic `machine` API and is what the
  # esp32, rp2 and stm32 ports implement.
  - type: deep_sleep
    label: []
    tooltip: Deep sleep process in milliseconds
    url: http://www.bipes.net.br
    boards: [3pi_2040, AmadoBoard, default, esp32, esp32-basic, esp32S2,
             esp32c3, esp32S3, otto-robot, stm32]
    import: {key: import_machine, line: "import machine"}
    code: "machine.deepsleep({interval})"
    params:
      - {name: interval, label: deep sleep, type: Number, default: 60000}

  - type: stop_timer
    colour: 0
    label: []
    tooltip: Stop Timer
    url: www.bipes.net.br
    boards: [3pi_2040, AmadoBoard, default, esp32, esp32-basic, esp32S2, esp32c3,
             esp32S3, otto-robot, esp8266, makernano, makerpi, rpi_pico, rpi_pico_w,
             stm32]
    import: {key: import_timer, line: "from machine import Timer"}
    code: "tim{timerNumber}.deinit()"
    params:
      - {name: timerNumber, label: Stop Timer, type: Number, default: 0}

  # Named for the ESP8266 and offered on eleven boards, only one of which was
  # one. `rtc.irq(trigger=rtc.ALARM0, …)` is ESP8266-only in MicroPython -- the
  # ESP32's `machine.RTC` has `datetime`, `init` and `memory` and nothing else,
  # so this raised an AttributeError on every other board that listed it, two
  # lines in and after the RTC had already been rebound. It is the ESP8266's
  # block now, and the other ten take `deep_sleep` above. The block itself is
  # unchanged.
  - type: deep_sleep8266
    label: []
    tooltip: Deep sleep process in milliseconds
    url: http://www.bipes.net.br
    boards: [esp8266]
    import: {key: import_machine, line: "import machine"}
    code: |-

      rtc = machine.RTC()
      rtc.irq(trigger=rtc.ALARM0, wake=machine.DEEPSLEEP)
      rtc.alarm(rtc.ALARM0, {interval})
      machine.deepsleep()
    params:
      - {name: interval, label: deep sleep, type: Number, default: 60}
