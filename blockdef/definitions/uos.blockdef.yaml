# The uos module, as generated from the MicroPython documentation.
#
# 18 of the 21 blocks here did not import `uos`, so a program using
# one died on a NameError. All of them do now.

module: uos
colour: 0
import: {line: "import uos", key: import_uos}

category:
  name: "uos"
  # esp32 has these categories too, but inside a "blocks below need
  # development" XML comment, so they are not offered there.
  toolboxes: [esp32S2, esp32c3, esp8266, rpi_pico, rpi_pico_w, makernano, makerpi, AmadoBoard, stm32, default, 3pi_2040]

blocks:
  - type: uos_uname
    label: " uname"
    kind: value
    tooltip: ".. function:: uname() Return a tuple (possibly a named tuple) containing information about the underlying machine and/or its operating system. The tuple has five fields "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    code: "uos.uname()"

  - type: uos_urandom
    label: []
    kind: value
    tooltip: ".. function:: urandom(n) Return a bytes object with block_definitions.js block_definitions_custom.js functions.txt generate-blocks.sh generator_stubs.js generator_stubs_custom.js onlyfunctions.txt random bytes. Whenever possible, it is generated by the hardware random number generator. "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    code: "uos.urandom({pIn})"
    params:
      - {name: pIn, label: " urandom"}

  - type: uos_chdir
    label: []
    tooltip: ".. function:: chdir(path) Change current directory. "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    code: "uos.chdir({pIn})"
    params:
      - {name: pIn, label: " chdir"}

  - type: uos_getcwd
    label: " getcwd"
    kind: value
    tooltip: ".. function:: getcwd() Get the current directory. "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    code: "uos.getcwd()"

  - type: uos_ilistdir
    label: []
    tooltip: " "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    code: "uos.ilistdir({pIn})"
    params:
      - {name: pIn, label: " ilistdir"}

  - type: uos_listdir
    label: []
    kind: value
    tooltip: " "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    import: {line: "import os", key: import_os}
    code: "os.listdir({pIn})"
    params:
      - {name: pIn, label: " listdir"}

  - type: uos_mkdir
    label: "Create new folder"
    tooltip: ".. function:: mkdir(path) Create a new directory. "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    code: "uos.mkdir({pIn})"
    params:
      - {name: pIn, label: "name", align: right}

  - type: uos_remove
    label: "Delete file"
    tooltip: ".. function:: remove(path) Remove a file. "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    code: "uos.remove({pIn})"
    params:
      - {name: pIn, label: "filename", align: right}

  - type: uos_rmdir
    label: []
    tooltip: ".. function:: rmdir(path) Remove a directory. "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    code: "uos.rmdir({pIn})"
    params:
      - {name: pIn, label: " rmdir"}

  - type: uos_rename
    label: []
    tooltip: ".. function:: rename(old_path, new_path) Rename a file. "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    code: "uos.rename({pIn})"
    params:
      - {name: pIn, label: " rename"}

  - type: uos_stat
    label: []
    kind: value
    tooltip: ".. function:: stat(path) Get the status of a file or directory. "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    code: "uos.stat({pIn})"
    params:
      - {name: pIn, label: " stat"}

  - type: uos_statvfs
    label: []
    kind: value
    tooltip: ".. function:: statvfs(path) Get the status of a fileystem. "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    code: "uos.statvfs({pIn})"
    params:
      - {name: pIn, label: " statvfs"}

  - type: uos_sync
    label: " sync"
    tooltip: ".. function:: sync() Sync all filesystems. "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    code: "uos.sync()"

  - type: uos_dupterm
    label: []
    tooltip: ".. function:: dupterm(stream_object, index=0, /) Duplicate or switch the MicroPython terminal (the REPL) on the given `stream` -like "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    code: "uos.dupterm({pIn})"
    params:
      - {name: pIn, label: " dupterm"}

  - type: uos_mount
    label: []
    tooltip: " "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    code: "uos.mount({pIn})"
    params:
      - {name: pIn, label: " mount"}

  - type: uos_umount
    label: []
    tooltip: ".. function:: umount(mount_point) Unmount a filesystem. *mount_point* can be a string naming the mount locatio n, "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    import: {line: "import os", key: import_os}
    code: "os.umount({pIn})"
    params:
      - {name: pIn, label: " umount"}

  # readblocks, writeblocks and ioctl are not functions on uos: the docs list
  # them on this page as the *protocol* a block device implements, the same way
  # `network` lists AbstractNIC. `uos.readblocks(...)` is not a thing, which is
  # what all three emitted. (block_definitions.js registered readblocks and
  # writeblocks twice each, so the category listed five entries for three
  # blocks; that was fixed earlier.)
  #
  # The answer is the one `uasyncio`'s Stream and Server blocks take: the
  # object is a socket, because something else makes it. In this tree that
  # something is `esp32.Partition`, which implements exactly these three; an
  # SD card or a user's own class does too.
  - type: uos_readblocks
    label: []
    tooltip: ".. method:: readblocks(block_num, buf, offset) The first form reads aligned, multiples of blocks. "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    import: []
    code: "{device}.readblocks({block_num}, {buf})"
    params:
      - {name: device,    label: " readblocks", align: right}
      - {name: block_num, label: from block, type: Number, default: 0, align: right}
      - {name: buf,       label: into, align: right}

  - type: uos_writeblocks
    label: []
    tooltip: ".. method:: writeblocks(block_num, buf, offset) The first form writes aligned, multiples of blocks, and requires that the blocks that are written to be first erased "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    import: []
    code: "{device}.writeblocks({block_num}, {buf})"
    params:
      - {name: device,    label: " writeblocks", align: right}
      - {name: block_num, label: from block, type: Number, default: 0, align: right}
      - {name: buf,       label: from, align: right}

  - type: uos_ioctl
    kind: value
    label: []
    tooltip: ".. method:: ioctl(op, arg) Control the block device and query its parameters. "
    url: "https://docs.micropython.org/en/latest/library/uos.html"
    import: []
    code: "{device}.ioctl({op}, {arg})"
    params:
      - {name: device, label: " ioctl", align: right}
      - {name: op,     label: command,  type: Number, default: 4, align: right}
      - {name: arg,    label: argument, type: Number, default: 0, align: right}
