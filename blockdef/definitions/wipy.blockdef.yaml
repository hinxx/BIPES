# One block, which emitted `wipy.heartbeat(…)` without importing `wipy`.
#
# **Offered by no board, which is the decision BACKLOG.md was holding.** It was
# listed on thirteen toolboxes and `import wipy` exists only on the WiPy, which
# is not among `devinfo.json`'s twenty-eight devices. It stays defined -- a
# saved program may hold it -- and the `boards:` line comes back the day a WiPy
# is added.

module: wipy
colour: 0
url: https://docs.micropython.org/en/latest/library/wipy.html
import: {key: import_wipy, line: "import wipy"}

category:
  name: wipy
  # esp32 has this category too, but inside a "blocks below need development"
  # XML comment, so it is not offered there.
  toolboxes: [3pi_2040, AmadoBoard, default, esp32S2, esp32c3, esp32S3, otto-robot,
              esp8266, makernano, makerpi, rpi_pico, rpi_pico_w, stm32]

blocks:

  - type: "wipy_heartbeat"
    offered: false
    code: "wipy.heartbeat({pIn})"
    label: []
    tooltip: " "
    params:
      - {name: pIn, label: " heartbeat"}
