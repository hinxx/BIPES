# The utime module, as generated from the MicroPython documentation.
#
# 6 of the 11 blocks here did not import `utime`, so a program using
# one died on a NameError. All of them do now.

module: utime
colour: 0
import: {line: "import utime", key: import_utime}

category:
  name: "utime"
  # esp32 has these categories too, but inside a "blocks below need
  # development" XML comment, so they are not offered there.
  toolboxes: [esp32S2, esp32c3, esp8266, rpi_pico, rpi_pico_w, makernano, makerpi, AmadoBoard, stm32, default, 3pi_2040]

blocks:
  - type: utime_localtime
    label: []
    tooltip: " "
    url: "https://docs.micropython.org/en/latest/library/utime.html"
    code: "utime.localtime({pIn})"
    params:
      - {name: pIn, label: " localtime"}

  - type: utime_mktime
    label: " mktime"
    tooltip: ".. function:: mktime() This is inverse function of localtime. It's argument is a full 8-tuple which expresses a time as per localtime. It returns an integer which is "
    url: "https://docs.micropython.org/en/latest/library/utime.html"
    code: "utime.mktime()"

  - type: utime_sleep
    label: []
    tooltip: ".. function:: sleep(seconds) Sleep for the given number of seconds. Some boards may accept *seconds* as a floating-point number to sleep for a fractional number of seconds. Note that "
    url: "https://docs.micropython.org/en/latest/library/utime.html"
    code: "utime.sleep({pIn})"
    params:
      - {name: pIn, label: " sleep"}

  - type: utime_sleep_ms
    label: []
    tooltip: ".. function:: sleep_ms(ms) Delay for given number of milliseconds, should be positive or 0. "
    url: "https://docs.micropython.org/en/latest/library/utime.html"
    code: "utime.sleep_ms({pIn})"
    params:
      - {name: pIn, label: " sleep_ms"}

  - type: utime_sleep_us
    label: []
    tooltip: ".. function:: sleep_us(us) Delay for given number of microseconds, should be positive or 0. "
    url: "https://docs.micropython.org/en/latest/library/utime.html"
    code: "utime.sleep_us({pIn})"
    params:
      - {name: pIn, label: " sleep_us"}

  - type: utime_ticks_ms
    label: " ticks_ms"
    tooltip: ".. function:: ticks_ms() Returns an increasing millisecond counter with an arbitrary reference point, that "
    url: "https://docs.micropython.org/en/latest/library/utime.html"
    code: "utime.ticks_ms()"

  - type: utime_ticks_us
    label: " ticks_us"
    tooltip: ".. function:: ticks_us() Just like `ticks_ms()` above, but in microseconds. "
    url: "https://docs.micropython.org/en/latest/library/utime.html"
    code: "utime.ticks_us()"

  - type: utime_ticks_cpu
    label: " ticks_cpu"
    tooltip: ".. function:: ticks_cpu() Similar to `ticks_ms()` and `ticks_us()`, but with the highest possible resol ution "
    url: "https://docs.micropython.org/en/latest/library/utime.html"
    code: "utime.ticks_cpu()"

  - type: utime_ticks_add
    label: []
    tooltip: ".. function:: ticks_add(ticks, delta) Offset ticks value by a given number, which can be either positive or negativ e. "
    url: "https://docs.micropython.org/en/latest/library/utime.html"
    code: "utime.ticks_add({pIn})"
    params:
      - {name: pIn, label: " ticks_add"}

  - type: utime_ticks_diff
    label: []
    tooltip: ".. function:: ticks_diff(ticks1, ticks2) Measure ticks difference between values returned from `ticks_ms()`, `ticks_us ()`, "
    url: "https://docs.micropython.org/en/latest/library/utime.html"
    code: "utime.ticks_diff({pIn})"
    params:
      - {name: pIn, label: " ticks_diff"}

  - type: utime_time
    label: " time"
    tooltip: ".. function:: time() Returns the number of seconds, as an integer, since the Epoch, assuming that underlying RTC is set and maintained as described above. If an RTC is not set "
    url: "https://docs.micropython.org/en/latest/library/utime.html"
    code: "utime.time()"
