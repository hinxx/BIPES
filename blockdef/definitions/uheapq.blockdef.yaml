# The uheapq module, as generated from the MicroPython documentation.
#
# None of these blocks imported the module they call, so every program using
# one died on a NameError. They do now.

module: uheapq
colour: 0
import: {line: "import uheapq", key: import_uheapq}

category:
  name: "uheapq"
  # esp32 has these categories too, but inside a "blocks below need
  # development" XML comment, so they are not offered there.
  toolboxes: [esp32, esp32S2, esp32c3, esp32S3, otto-robot, esp8266, rpi_pico,
              rpi_pico_w, makernano, makerpi, AmadoBoard, stm32, default,
              3pi_2040]

blocks:
  - type: uheapq_heappush
    label: []
    tooltip: ".. function:: heappush(heap, item) Push the ``item`` onto the ``heap``. "
    url: "https://docs.micropython.org/en/latest/library/uheapq.html"
    code: "uheapq.heappush({pIn})"
    params:
      - {name: pIn, label: " heappush"}

  - type: uheapq_heappop
    label: []
    tooltip: ".. function:: heappop(heap) Pop the first item from the ``heap``, and return it. Raises IndexError if heap is empty. "
    url: "https://docs.micropython.org/en/latest/library/uheapq.html"
    code: "uheapq.heappop({pIn})"
    params:
      - {name: pIn, label: " heappop"}

  - type: uheapq_heapify
    label: []
    tooltip: ".. function:: heapify(x) Convert the list ``x`` into a heap. This is an in-place operation. "
    url: "https://docs.micropython.org/en/latest/library/uheapq.html"
    code: "uheapq.heapify({pIn})"
    params:
      - {name: pIn, label: " heapify"}
