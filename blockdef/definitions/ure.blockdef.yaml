# The ure module, which has *two* objects rather than one: a compiled regex and
# a match. Every block that made one threw it away -- `ure.compile(…)`,
# `ure.match(…)` and `ure.search(…)` were all statements assigned to nothing --
# and every block that used one called the method on the module:
# `ure.regex.match(…)`, `ure.match.group(…)`.
#
# The compiled regex is `ure_regex` and the match is `ure_m`. Anything that
# produces a match assigns to `ure_m`, so the four `match.*` blocks have
# something to read whichever of the three produced it. `ure_match.group` and
# `ure_match.groups` were also value blocks returning `ure.match.group(…)\n`,
# newline and all.

module: ure
class: compile
instance: ure_regex
colour: 0
url: https://docs.micropython.org/en/latest/library/ure.html
import: {key: import_ure, line: "import ure"}

category:
  name: ure
  # esp32 has this category too, but inside a "blocks below need development"
  # XML comment, so it is not offered there.
  toolboxes: [3pi_2040, AmadoBoard, default, esp32S2, esp32c3, esp8266, makernano, makerpi,
              rpi_pico, rpi_pico_w, stm32]

blocks:

  - type: "ure_compile"
    constructor: true
    label: []
    tooltip: " "
    params:
      - {name: pIn, label: " compile"}

  - type: "ure_match"
    code: "ure_m = ure.match({pIn})"
    label: []
    tooltip: ".. function:: match(regex_str, string) Compile *regex_str* and match against *string*. Match always happens from starting position in a string. "
    params:
      - {name: pIn, label: " match"}

  - type: "ure_search"
    code: "ure_m = ure.search({pIn})"
    label: []
    tooltip: ".. function:: search(regex_str, string) Compile *regex_str* and search it in a *string*. Unlike `match`, this will se arch "
    params:
      - {name: pIn, label: " search"}

  - type: "ure_sub"
    code: "ure.sub({pIn})"
    label: []
    tooltip: ".. function:: sub(regex_str, replace, string, count=0, flags=0, /) Compile *regex_str* and search for it in *string*, replacing all matches with *replace*, and returning the new string. "
    params:
      - {name: pIn, label: " sub"}

  - type: "ure_regex.match"
    code: "ure_m = ure_regex.match({pIn})"
    label: []
    tooltip: ".. method:: regex.match(string) regex.search(string) regex.sub(replace, string, count=0, flags=0, /) "
    params:
      - {name: pIn, label: " regex.match"}

  - type: "ure_regex.split"
    fn: split
    label: []
    tooltip: ".. method:: regex.split(string, max_split=-1, /) Split a *string* using regex. If *max_split* is given, it specifies maximum number of splits to perform. Returns list of strings (there "
    params:
      - {name: pIn, label: " regex.split"}

  - type: "ure_match.group"
    code: "ure_m.group({pIn})"
    kind: value
    label: []
    tooltip: ".. method:: match.group(index) Return matching (sub)string. *index* is 0 for entire match, 1 and above for each capturing group. Only numeric groups are supported. "
    params:
      - {name: pIn, label: " match.group"}

  - type: "ure_match.groups"
    code: "ure_m.groups()"
    kind: value
    label: " match.groups"
    tooltip: ".. method:: match.groups() Return a tuple containing all the substrings of the groups of the match. "

  - type: "ure_match.start"
    code: "ure_m.start({pIn})"
    label: []
    tooltip: " "
    params:
      - {name: pIn, label: " match.start"}

  - type: "ure_match.span"
    code: "ure_m.span({pIn})"
    label: []
    tooltip: " "
    params:
      - {name: pIn, label: " match.span"}
