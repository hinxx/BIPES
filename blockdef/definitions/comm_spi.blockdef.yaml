# The same six blocks as machine_spi.blockdef.yaml, under the name the
# `Communication` tree gives the category. Declared there; placed here.

module: machine
import: []

category:
  name: SPI
  labels: [SPI]
  toolboxes: [3pi_2040, AmadoBoard, default, esp32, esp32S2, esp32c3, esp32S3,
              otto-robot, esp8266, makernano, makerpi, rpi_pico, rpi_pico_w,
              stm32]
  # The param defaults (14/15/16) are ESP32 spellings and the esp32c3 has none
  # of them -- its pins stop at GPIO10 but for 20 and 21 -- so all three
  # sockets fell back to GPIO0. SPI pins per board: blockdef/README.md.
  defaults:
    esp32c3:    {sck: 8,  mosi: 10, miso: 9}
    esp32S3:    {sck: 7,  mosi: 6,  miso: 8}
    otto-robot: {sck: 14, mosi: 13, miso: 10}
    makerpi:    {sck: 12, mosi: 13, miso: 14}

blocks:
  - {type: machine.SPI_SPI.init, external: true, params: [
      {name: id, type: Number, default: 0, align: right},
      {name: baudrate, type: Number, default: 1000000, align: right},
      {name: sck, pin: true, align: right, default: 14},
      {name: mosi, pin: true, align: right, default: 15},
      {name: miso, pin: true, align: right, default: 16}]}
  - {type: machine.SPI_SPI.deinit, external: true}
  - {type: machine.SPI_SPI.read, external: true, params: [
      {name: nbytes, type: Number, default: 1, align: right},
      {name: write, type: Number, default: 0, align: right}]}
  - {type: machine.SPI_SPI.readinto, external: true, params: [
      {name: buf, align: right, plug: {type: variables_get, fields: {VAR: buf}}},
      {name: write, type: Number, default: 0, align: right}]}
  - {type: machine.SPI_SPI.write, external: true, params: [
      {name: buf, align: right, plug: {type: variables_get, fields: {VAR: buf}}}]}
  - {type: machine.SPI_SPI.write_readinto, external: true, params: [
      {name: write_buf, align: right, plug: {type: variables_get, fields: {VAR: write_buf}}},
      {name: read_buf, align: right, plug: {type: variables_get, fields: {VAR: read_buf}}}]}
