# Anemometer: a reed switch on a pin interrupt, counted by a handler the user
# names. Portuguese labels, as it shipped -- the input is even called "Função".

module: machine
colour: 255
import: {line: "import machine", key: import_machine}

category:
  name: Anemômetro
  labels: [Anenômetro]
  toolboxes: [esp32, esp32-basic, esp32c3, esp32S2, esp8266, AmadoBoard]

blocks:
  - type: anemo_init
    label:
      - {image: {src: media/aneno.gif, width: 55, height: 55}, text: Iniciar Anenômetro}
    code: |-
      anemometro=machine.Pin({pin},machine.Pin.IN,machine.Pin.PULL_UP) 
      anemometro.irq(trigger=machine.Pin.IRQ_FALLING,handler={Função})
    params:
      - {name: "Função", label: "Função", type: String, unquote: true, align: right}
      - {name: pin, label: {text: pin, field: ANENO_PIN_MSG}, type: Number, pin: true, align: right}

  - type: anemo_stop
    label: {text: Parar Anenômetro, field: STOP_ANENO}
    code: "anemometro.irq(trigger=0,handler={Função})"
    params:
      - {name: "Função", label: "Função", type: String, unquote: true, align: right}
