# The math module, as generated from the MicroPython documentation.
#
# None of these blocks imported `math`, so every program using one died on a
# NameError. They do now.

module: math
colour: 0
import: {line: "import math", key: import_math}

category:
  name: "math"
  # esp32 has these categories too, but inside a "blocks below need
  # development" XML comment, so they are not offered there.
  toolboxes: [esp32S2, esp32c3, esp32S3, otto-robot, esp8266, rpi_pico, rpi_pico_w,
              makernano, makerpi, AmadoBoard, stm32, default, 3pi_2040]

