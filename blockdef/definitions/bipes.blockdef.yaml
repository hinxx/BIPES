# The IDE's own blocks: the project header comment, the plot line the IOT tab
# reads, and the Databoard store.
#
# `project_metadata` had four `Blockly.FieldLabel`s carrying names -- `NAME`,
# `project_author`, `project_iot_id`, `project_description`, the last three
# colliding with the names of the block's own value inputs. FieldLabel is not
# serializable, so nothing was ever saved under them; what they were good for
# was `<field name="project_author">Author</field>` presets in five toolboxes,
# which overwrite the translated label with English on load. `Info` on bbblack
# and linux pinned all four. The names are gone and so are the presets, so the
# block reads in the user's language everywhere.
#
# It also set neither a previous nor a next statement, so the header could not
# be attached to the program it heads. It is an ordinary statement block now.
#
# `localstorage_store` stays hand-written: it carries a mutator, which is real
# behaviour rather than a declaration. Only its toolbox entry is generated.

module: sys
colour: 230
url: http://www.bipes.net.br
import: []

category:
  name: BIPES
  toolboxes: [3pi_2040, AmadoBoard, arduino, esp32, esp32-basic, esp32S2, esp32c3,
              esp8266, makernano, makerpi, rpi_pico, rpi_pico_w]

blocks:
  - type: project_metadata
    label: {msg: project_info}
    tooltip: Information about the project
    code: |-
      #Code automatically generated by BIPES (http://www.bipes.net.br)
      #Author: {project_author}
      #IOT ID: {project_iot_id}
      #Description: {project_description}
    params:
      - {name: project_author, label: {msg: project_info_author}, type: String,
         align: right}
      - {name: project_iot_id, label: IOT ID, type: Number, align: right}
      - {name: project_description, label: {msg: project_info_desc}, type: String,
         align: right}

  - type: bipes_plot
    label: {msg: show_iot}
    tooltip: BIPES Plot
    # The generator used to fall back to '' for an empty socket, because the
    # toolbox entry came with none: `print('$BIPES-DATA:',,',',)` otherwise.
    # The entry has shadows now, so there is nothing to fall back from.
    code: "print('$BIPES-DATA:',{id},',',{values})"
    params:
      - {name: id,     label: ID,          type: Number, default: 0, align: right}
      - {name: values, label: {msg: data}, type: Number, default: 0, align: right}

  - type: localstorage_store
    external: true
    boards: [3pi_2040, AmadoBoard, esp32, esp32-basic, esp32S2, esp32c3, esp8266,
             makernano, makerpi, rpi_pico, rpi_pico_w]
    params:
      - {name: ADD0, plug: {type: "utime.vars", shadow: true, fields: {VARS: ticks_ms}}}
