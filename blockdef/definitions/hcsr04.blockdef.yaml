# HC-SR04 ultrasonic distance sensor.
#
# The driver takes keyword arguments, and the block's inputs are in a different
# order from the constructor's, so this one leans on `keyword:` and `args:`.

module: hcsr04
class: HCSR04
instance: ultraSoundSensor
colour: 230
url: http://www.bipes.net.br
import: {line: "from hcsr04 import HCSR04", key: import_hcr}

category:
  name: "%{BKY_CAT_ULTRASOUND}"
  library: HCSR04
  labels:
    - HCSR04 ultrasound distance sensor
    - "Library: https://github.com/rsc1975/micropython-hcsr04"
  toolboxes: [esp32, esp32-basic, esp32c3, esp32S3, otto-robot, esp32S2, esp8266,
              rpi_pico, rpi_pico_w, makernano, makerpi, AmadoBoard, stm32, default,
              3pi_2040]
  # The only thing 13 boards genuinely disagreed about -- and the thing all but
  # one of them had no answer for, so trigger and echo arrived on the same
  # GPIO. Free GPIOs per board, except the OTTO, whose ultrasonic pins are on
  # its own pinout. `stm32` and `default` are left out: neither gives a pinout.
  defaults:
    esp32:       {echo: 12, trigger: 13}
    esp32-basic: {echo: 12, trigger: 13}
    AmadoBoard:  {echo: 12, trigger: 13}
    esp32c3:     {echo: 2,  trigger: 3}
    esp32S2:     {echo: 12, trigger: 13}
    esp32S3:     {echo: 15, trigger: 16}
    otto-robot:  {echo: 5,  trigger: 18}
    esp8266:     {echo: 12, trigger: 13}
    rpi_pico:    {echo: 0,  trigger: 1}
    rpi_pico_w:  {echo: 0,  trigger: 1}
    3pi_2040:    {echo: 0,  trigger: 1}
    makernano:   {echo: 0,  trigger: 1}
    makerpi:     {echo: 0,  trigger: 1}

blocks:
  - type: hcsr_init
    label:
      - {image: {src: media/hcsr04.png, width: 55, height: 55}, msg: hcsr_init}
    tooltip: {msg: hcsr_init}
    constructor: true
    # Only the constructor needs these two; the reading block does not.
    import:
      - {line: "import time", key: import_time}
      - {line: "from machine import Pin", key: import_pin}
    args: [trigger, echo, timeout]
    params:
      - {name: echo,    label: echo pin,    type: Number, pin: true, align: right,
         keyword: echo_pin, default: 12}
      - {name: trigger, label: trigger pin, type: Number, pin: true, align: right,
         keyword: trigger_pin, default: 13}
      - {name: timeout, label: {msg: hcsr_timeout, field: DHT_PIN_MSG}, type: Number,
         default: 10000, align: right, keyword: echo_timeout_us}

  - type: hcsr_read
    fn: distance_mm
    kind: value
    label:
      - {msg: get_distance, field: MSG_READ_DHT_TEMP}
    tooltip: {msg: measure_distance}
