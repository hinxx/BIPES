# MG-series gas sensors, the same shape as the MQ family. AO goes to an ADC, DO to a
# comparator pin whose interrupt hands the callback a voltage.
#
# Five dead sockets: load resistor, reference voltage, sample count, delay,
# and the polynomial coefficients -- the last one a text field with a live
# socket beside it, so the block showed two places to type coefficients and
# read neither of the ones you would reach for.
#
# `mgx_set_callback` re-indented the user's stack with
# `replace(/^/gm, '\n')`, which leaves the `def` with an empty body. And
# "Enable Callback: Yes" passed `mgx_callback` with nothing defining it
# unless the set-callback block was also in the program -- and that block
# needs the sensor object first. The default callback is hoisted now.

module: mgx
instance: mg_sensor_device
colour: 230
url: https://freakstudio.cn/node/019b88b8-4451-7065-92ee-d20e8165a0c2
import:
  - {line: "import mgx", key: import_mgx}

category:
  name: MG Gas Sensor
  library: mgx
  labels:
    - "Library: https://github.com/FreakStudioCN/GraftSense-Drivers-MicroPython"
    - MG Gas Sensor (AO/DO with IRQ Callback)
  toolboxes: [rpi_pico]

blocks:
  - type: mgx_init
    label:
      - {image: {src: media/mgx_gas.png, width: 55, height: 55}}
      - Init MG Gas Sensor
    tooltip: Init MG series gas sensor (AO/DO with IRQ & Callback)
    fields: {ENABLE_CALLBACK: "NO"}
    import:
      - {line: "from machine import Pin, ADC", key: import_machine_pin_adc}
      - key: mgx_default_callback
        line: |-
          def mgx_callback(voltage):
            print("MG Sensor Voltage:", voltage)
    code: |-
      mg_adc = ADC({adc_pin})
      mg_comp_pin = Pin({comp_pin}, Pin.IN)
      {instance} = mgx.MGX(adc=mg_adc, comp_pin=mg_comp_pin, user_cb={ENABLE_CALLBACK}, rl_ohm={rl_ohm}, vref={vref})
    params:
      - {name: adc_pin, label: ADC Pin (AO), type: Number, pin: true, default: 26,
         align: right}
      - {name: comp_pin, label: Comparator Pin (DO), type: Number, pin: true,
         default: 19, align: right}
      - {name: rl_ohm, label: "Load Resistor (Ohm)", type: Number, default: 10000,
         align: right}
      - {name: vref, label: Reference Voltage (V), type: Number, default: 3.3,
         align: right}
      - {name: ENABLE_CALLBACK, label: Enable Callback, kind: dropdown,
         options: [{Yes: "YES"}, {No: "NO"}],
         emit: {YES: "mgx_callback", NO: "None"}}

  - type: mgx_select_builtin
    fn: select_builtin
    label: []
    tooltip: Select built-in polynomial model for MG sensor
    params:
      - {name: MODEL, label: Select MG Sensor Model, kind: dropdown,
         options: [{MG811: '"MG811"'}, {MG812: '"MG812"'}]}

  - {type: mgx_read_voltage, fn: read_voltage, kind: value,
     label: Read MG Sensor Voltage (V),
     tooltip: Read analog voltage from MG sensor AO pin}

  - type: mgx_read_ppm
    fn: read_ppm
    kind: value
    label: Read MG Sensor PPM
    tooltip: Calculate gas concentration in PPM using built-in polynomial
    params:
      - {name: samples, label: Samples, type: Number, default: 1, align: right,
         keyword: samples}
      - {name: delay_ms, label: Delay (ms), type: Number, default: 0, align: right,
         keyword: delay_ms}
      - {name: SENSOR_TYPE, label: Sensor Type, kind: dropdown, keyword: sensor,
         options: [{MG811: '"MG811"'}, {MG812: '"MG812"'}]}

  - type: mgx_set_custom_poly
    fn: set_custom_polynomial
    label: Set MG Custom Polynomial
    tooltip: Set custom polynomial coefficients for PPM calculation
    params:
      - {name: coeffs, label: "Coefficients [a0,a1,a2...]", type: String,
         default: "[0.0,100.0,-20.0]", unquote: true, align: right}

  - type: mgx_set_callback
    label: Set MG Sensor Callback
    tooltip: Set callback code to run on MG sensor voltage change
    code: |-
      def mgx_callback(voltage):
      {CALLBACK_CODE}{instance}.user_cb = mgx_callback
    params:
      - {name: CALLBACK_CODE, kind: statements, align: right,
         label: "Run when voltage changes (param: voltage)",
         plug: {type: text_print, values: {TEXT: "MG sensor voltage changed"}}}

  - {type: mgx_deinit, fn: deinit, label: Deinitialize MG Sensor,
     tooltip: Release MG sensor resources and disable IRQ}
