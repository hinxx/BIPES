# VL53L0X time-of-flight distance sensor.
#
# `ping()` takes one reading and blocks for it. `start()` puts the sensor in
# continuous mode and `read()` then returns whatever the last completed
# measurement was, which is what a loop wants -- those two blocks come from
# hogeiha/BIPES @ offline.
#
# That fork also had a second `vl53l0x_init` of its own, building an I2C bus
# by hand at a fixed address. It is not taken: `init_vl53l0x` below is the
# same constructor with the shared bus, and two init blocks for one sensor is
# two ways to get a different object.

module: vl53l0x
class: VL53L0X
instance: tof
colour: 135
import: {line: "from vl53l0x import VL53L0X", key: import_vl53l0x}

category:
  name: Time of Flight
  library: vl53l0x
  labels:
    - VL53L0X
    - "Library: https://github.com/kevinmcaleer/vl53l0x"
  toolboxes: [rpi_pico, rpi_pico_w, makernano, makerpi]
  defaults:
    rpi_pico:   {sda: 0, scl: 1}
    rpi_pico_w: {sda: 0, scl: 1}
    makernano:  {sda: 0, scl: 1}
    makerpi:    {sda: 0, scl: 1}

blocks:
  - type: init_vl53l0x
    label:
      - Init VL53L0X
      - {image: {src: media/vl53l0x.jpg, width: 55, height: 55}}
    tooltip: ""
    i2c_bus: {id: i2c, scl: scl, sda: sda}
    args: [bus]
    constructor: true
    params:
      - {name: i2c, label: I2C, type: Number, default: 0, align: right}
      - {name: scl, label: SCL, type: Number, pin: true,  align: right, default: 1}
      - {name: sda, label: SDA, type: Number, pin: true,  align: right, default: 0}

  - type: vl53l0x_read_tof
    fn: ping
    kind: value
    label: {text: Time of Flight, field: MSG_READ_TOF}
    tooltip: Time of Flight (mm)
    url: http://www.bipes.net.br
    colour: 230

  - {type: vl53l0x_start, fn: start, label: Start VL53L0X Measurement,
     tooltip: Start VL53L0X continuous measurement, colour: 230}

  - {type: vl53l0x_read_distance, fn: read, kind: value,
     label: Read VL53L0X Distance (mm),
     tooltip: Read the last completed continuous measurement (mm), colour: 230}
