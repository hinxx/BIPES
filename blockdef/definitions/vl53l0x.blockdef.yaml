# VL53L0X time-of-flight distance sensor.

module: vl53l0x
class: VL53L0X
instance: tof
colour: 135
import: {line: "from vl53l0x import VL53L0X", key: import_vl53l0x}

category:
  name: Time of Flight
  library: vl53l0x
  labels:
    - VL53L0X
    - "Library: https://github.com/kevinmcaleer/vl53l0x"
  toolboxes: [rpi_pico, rpi_pico_w, makernano, makerpi]
  defaults:
    rpi_pico: {scl: 1, sda: 0}

blocks:
  - type: init_vl53l0x
    label:
      - Init VL53L0X
      - {image: {src: media/vl53l0x.jpg, width: 55, height: 55}}
    tooltip: ""
    i2c_bus: {id: i2c, scl: scl, sda: sda}
    args: [bus]
    constructor: true
    params:
      - {name: i2c, label: I2C, type: Number, default: 0, align: right}
      - {name: scl, label: SCL, type: Number, pin: true,  align: right}
      - {name: sda, label: SDA, type: Number, pin: true,  align: right}

  - type: vl53l0x_read_tof
    fn: ping
    kind: value
    label: {text: Time of Flight, field: MSG_READ_TOF}
    tooltip: Time of Flight (mm)
    url: http://www.bipes.net.br
    colour: 230
