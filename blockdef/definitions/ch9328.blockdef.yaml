                   {F5: "ch9328.CH9328.KEY_F5"}, {F6: "ch9328.CH9328.KEY_F6"},
                   {F7: "ch9328.CH9328.KEY_F7"}, {F8: "ch9328.CH9328.KEY_F8"},
                   {F9: "ch9328.CH9328.KEY_F9"}, {F10: "ch9328.CH9328.KEY_F10"},
