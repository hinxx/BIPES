  - {type: builtins_to_bytes, kind: value, label: [], inline: true,
     code: "{x}.to_bytes({length}, {byteorder})",
     tooltip: "A whole number as that many bytes.",
     params: [{name: x, label: bytes of, plug: {type: variables_get, fields: {VAR: n}}},
              {name: length, label: length, type: Number, default: 2},
              {name: byteorder, label: order, kind: dropdown,
               options: [{little: "'little'"}, {big: "'big'"}]}]}

  - {type: builtins_isinstance, kind: value, label: [], inline: true,
     code: "isinstance({obj}, {classinfo})",
     tooltip: "True if the object is of that type.",
     params: [{name: obj, label: is, plug: {type: variables_get, fields: {VAR: obj}}},
              {name: classinfo, label: "an instance of", plug: {type: variables_get, fields: {VAR: cls}}}]}

  - {type: builtins_issubclass, kind: value, label: [], inline: true,
     code: "issubclass({cls}, {classinfo})",
     tooltip: "True if the first class derives from the second.",
     params: [{name: cls, label: is, plug: {type: variables_get, fields: {VAR: cls}}},
              {name: classinfo, label: "a subclass of", plug: {type: variables_get, fields: {VAR: parent}}}]}

  - {type: builtins_iter, kind: value, label: [], inline: true, code: "iter({obj})",
     tooltip: "An iterator over the object.",
     params: [{name: obj, label: iterator over}]}

  - {type: builtins_len, kind: value, label: [], inline: true, code: "len({obj})",
     tooltip: "How many items there are.",
     params: [{name: obj, label: length of}]}

  - {type: builtins_locals, kind: value, inline: true, label: locals,
