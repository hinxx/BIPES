  - {type: builtins_setattr, label: [], inline: true,
     code: "setattr({obj}, {name}, {value})",
     tooltip: "Write an attribute chosen by name.",
     params: [{name: obj, label: set attribute of, plug: {type: variables_get, fields: {VAR: obj}}},
              {name: name, label: named, type: String, default: attr},
              {name: value, label: to, plug: {type: variables_get, fields: {VAR: value}}}]}

  - {type: builtins_sorted, kind: value, label: [], inline: true, code: "sorted({iterable})",
     tooltip: "The items in order, as a new list.",
     params: [{name: iterable, label: sorted}]}

  - {type: builtins_staticmethod, kind: value, label: [], inline: true,
     code: "staticmethod({function})",
     tooltip: "Turn a function into a static method.",
     params: [{name: function, label: static method}]}

  - {type: builtins_sum, kind: value, label: [], inline: true, code: "sum({iterable})",
     tooltip: "The items added together.",
     params: [{name: iterable, label: sum of}]}

  - {type: builtins_super, kind: value, inline: true, label: super,
     code: "super()", tooltip: The parent class of the one being defined.}

  - {type: builtins_type, kind: value, label: [], inline: true, code: "type({obj})",
