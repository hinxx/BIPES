# Python's built-in functions, as the MicroPython docs list them.
#
# All 49 were statements that took no arguments and emitted a call with none
# either -- `builtins.abs()`, `builtins.len()`, `builtins.sorted()` -- under an
# `import builtins` that MicroPython accepts and Python does not need. Every
# one of them was a TypeError waiting to happen, and the stock-take in
# BACKLOG.md counted them as 49 blocks nobody could use.
#
# Giving them their arguments is the whole conversion, and the arguments are
# not a judgement call: they are the signatures. Two consequences:
#
# * 45 of the 49 become value blocks, because that is what a function that
#   returns something is. `delattr`, `exec`, `print` and `setattr` stay
#   statements. A saved program holding one keeps the block and loses its
#   connection -- and nothing that ran can break, because `builtins.abs()`
#   never ran.
# * No import. Builtins are builtins; `abs(x)` is the whole of it.
#
# `to_bytes` is `int.to_bytes`, a method the docs list on this page rather than
# a function, so it is the one block here that calls something on its input.
#
# The blocks whose argument is a number carry a number shadow, so they generate
# Python that runs the moment they are dragged out; the ones that take a list,
# an object or a function do not, because there is no literal to put there.

module: builtins
colour: 0
url: https://docs.micropython.org/en/latest/library/builtins.html
import: []

category:
  name: builtins
  toolboxes: [3pi_2040, AmadoBoard, default, esp32, esp32S2, esp32c3, esp32S3,
              otto-robot, esp8266, makernano, makerpi, rpi_pico, rpi_pico_w,
              stm32]

blocks:
  - {type: builtins_abs, kind: value, label: [], inline: true, code: "abs({x})",
     tooltip: "The absolute value of a number.",
     params: [{name: x, label: abs, type: Number, default: 0}]}

  - {type: builtins_all, kind: value, label: [], inline: true, code: "all({iterable})",
     tooltip: "True if every item is true (and if there are none).",
     params: [{name: iterable, label: all of}]}

  - {type: builtins_any, kind: value, label: [], inline: true, code: "any({iterable})",
     tooltip: "True if at least one item is true.",
     params: [{name: iterable, label: any of}]}

  - {type: builtins_bin, kind: value, label: [], inline: true, code: "bin({x})",
     tooltip: "A number as a binary string: 5 becomes '0b101'.",
     params: [{name: x, label: binary of, type: Number, default: 5}]}

  - {type: builtins_callable, kind: value, label: [], inline: true, code: "callable({obj})",
     tooltip: "True if the object can be called like a function.",
     params: [{name: obj, label: callable}]}

  - {type: builtins_chr, kind: value, label: [], inline: true, code: "chr({i})",
     tooltip: "The character with this code point: 65 becomes 'A'.",
     params: [{name: i, label: character with code, type: Number, default: 65}]}

  - {type: builtins_classmethod, kind: value, label: [], inline: true,
     code: "classmethod({function})",
     tooltip: "Turn a function into a class method.",
     params: [{name: function, label: class method}]}

  - {type: builtins_compile, kind: value, label: [], inline: true,
     code: "compile({source}, {filename}, {mode})",
     tooltip: "Compile source text into a code object for eval or exec.",
     params: [{name: source, label: compile, plug: {type: variables_get, fields: {VAR: source}}},
              {name: filename, label: named, type: String, default: "<string>"},
              {name: mode, label: as, type: String, default: exec}]}

  - {type: builtins_delattr, label: [], inline: true, code: "delattr({obj}, {name})",
     tooltip: "Remove a named attribute from an object.",
     params: [{name: obj, label: delete attribute of, plug: {type: variables_get, fields: {VAR: obj}}},
              {name: name, label: named, type: String, default: attr}]}

  - {type: builtins_dir, kind: value, label: [], inline: true, code: "dir({obj})",
     tooltip: "The list of names an object carries.",
     params: [{name: obj, label: names in}]}

  - {type: builtins_divmod, kind: value, label: [], inline: true, code: "divmod({a}, {b})",
     tooltip: "Quotient and remainder at once, as a pair.",
     params: [{name: a, label: divmod, type: Number, default: 7},
              {name: b, label: by, type: Number, default: 2}]}

  - {type: builtins_enumerate, kind: value, label: [], inline: true,
     code: "enumerate({iterable})",
     tooltip: "Pairs of (position, item) over anything you can loop through.",
     params: [{name: iterable, label: numbered items of}]}

  - {type: builtins_eval, kind: value, label: [], inline: true, code: "eval({expression})",
     tooltip: "Evaluate a Python expression held in a string.",
     params: [{name: expression, label: evaluate, type: String, default: "1 + 1"}]}

  - {type: builtins_exec, label: [], inline: true, code: "exec({code})",
     tooltip: "Run Python statements held in a string.",
     params: [{name: code, label: execute, type: String, default: "print('hi')"}]}

  - {type: builtins_filter, kind: value, label: [], inline: true,
     code: "filter({function}, {iterable})",
     tooltip: "Keep the items a function says yes to.",
     params: [{name: function, label: filter with, plug: {type: variables_get, fields: {VAR: func}}},
              {name: iterable, label: over, plug: {type: variables_get, fields: {VAR: items}}}]}

  - {type: builtins_getattr, kind: value, label: [], inline: true,
     code: "getattr({obj}, {name})",
     tooltip: "Read an attribute chosen by name.",
     params: [{name: obj, label: attribute of, plug: {type: variables_get, fields: {VAR: obj}}},
              {name: name, label: named, type: String, default: attr}]}

  - {type: builtins_globals, kind: value, inline: true, label: globals,
     code: "globals()", tooltip: The dictionary of global names.}

  - {type: builtins_hasattr, kind: value, label: [], inline: true,
     code: "hasattr({obj}, {name})",
     tooltip: "True if the object has an attribute of that name.",
     params: [{name: obj, label: has attribute, plug: {type: variables_get, fields: {VAR: obj}}},
              {name: name, label: named, type: String, default: attr}]}

  - {type: builtins_hash, kind: value, label: [], inline: true, code: "hash({obj})",
     tooltip: "The hash value of an object.",
     params: [{name: obj, label: hash of}]}

  - {type: builtins_hex, kind: value, label: [], inline: true, code: "hex({x})",
     tooltip: "A number as a hexadecimal string: 255 becomes '0xff'.",
     params: [{name: x, label: hex of, type: Number, default: 255}]}

  - {type: builtins_id, kind: value, label: [], inline: true, code: "id({obj})",
     tooltip: "The identity of an object, as a number.",
     params: [{name: obj, label: id of}]}

  - {type: builtins_input, kind: value, label: [], inline: true, code: "input({prompt})",
     tooltip: "Read a line typed at the REPL.",
