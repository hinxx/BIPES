     tooltip: "Apply a function to every item.",
     params: [{name: function, label: apply, plug: {type: variables_get, fields: {VAR: func}}},
              {name: iterable, label: to each of, plug: {type: variables_get, fields: {VAR: items}}}]}

  - {type: builtins_max, kind: value, label: [], inline: true, code: "max({iterable})",
     tooltip: "The largest item.",
     params: [{name: iterable, label: largest of}]}

  - {type: builtins_min, kind: value, label: [], inline: true, code: "min({iterable})",
     tooltip: "The smallest item.",
     params: [{name: iterable, label: smallest of}]}

  - {type: builtins_next, kind: value, label: [], inline: true, code: "next({iterator})",
     tooltip: "The next item from an iterator.",
     params: [{name: iterator, label: next from}]}

  - {type: builtins_oct, kind: value, label: [], inline: true, code: "oct({x})",
     tooltip: "A number as an octal string: 8 becomes '0o10'.",
     params: [{name: x, label: octal of, type: Number, default: 8}]}

  - {type: builtins_open, kind: value, label: [], inline: true, code: "open({file}, {mode})",
     tooltip: "Open a file and return the file object.",
     params: [{name: file, label: open, type: String, default: data.txt},
              {name: mode, label: mode, kind: dropdown,
               options: [{read: "'r'"}, {write: "'w'"}, {append: "'a'"},
                         {"read bytes": "'rb'"}, {"write bytes": "'wb'"}]}]}

  - {type: builtins_ord, kind: value, label: [], inline: true, code: "ord({c})",
     tooltip: "The code point of a character: 'A' becomes 65.",
     params: [{name: c, label: code of, type: String, default: A}]}

  - {type: builtins_pow, kind: value, label: [], inline: true, code: "pow({x}, {y})",
     tooltip: "One number raised to the power of another.",
     params: [{name: x, label: pow, type: Number, default: 2},
              {name: y, label: to the power, type: Number, default: 8}]}

  - {type: builtins_print, label: [], inline: true, code: "print({value})",
     tooltip: "Print to the serial console.",
     params: [{name: value, label: print}]}

  - {type: builtins_property, kind: value, label: [], inline: true,
     code: "property({getter})",
     tooltip: "Turn a function into a read-only attribute.",
     params: [{name: getter, label: property from}]}

  - {type: builtins_range, kind: value, label: [], inline: true, code: "range({stop})",
