# Rain gauge: the same reed-switch-on-an-interrupt shape as the anemometer.

module: machine
colour: 100
import: {line: "import machine", key: import_machine}

category:
  name: Pluviômetro
  labels: [Pluviômetro]
  toolboxes: [esp32, esp32-basic, esp32c3, esp32S2, esp8266, AmadoBoard]

blocks:
  - type: pluvio_init
    label:
      - {image: {src: media/pluivio.gif, width: 70, height: 70}, text: Iniciar Pluiômetro}
    code: |-
      pluviometro=machine.Pin({pin},machine.Pin.IN,machine.Pin.PULL_UP) 
      pluviometro.irq(trigger=machine.Pin.IRQ_FALLING,handler={Função})
    params:
      - {name: "Função", label: "Função", type: String, unquote: true, align: right,
         default: contar_chuva}
      - {name: pin, label: {text: pin, field: PLUVIO_PIN}, type: Number, pin: true, align: right}

  - type: pluvio_stop
    label: {text: Parar Plviômetro, field: STOP_PLUVIO}
    code: "pluviometro.irq(trigger=0,handler={Função})"
    params:
      - {name: "Função", label: "Função", type: String, unquote: true, align: right,
         default: contar_chuva}
