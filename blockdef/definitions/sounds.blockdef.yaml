  - type: rtttl_play
    label: Play song (RTTTL)
    tooltip: Play one of the songs listed below, or any RTTTL melody of your own
    url: bipes.net.br
    import:
      - {key: import_pin,   line: "from machine import Pin"}
      - {key: import_rtttl, line: "import rtttl, songs"}
      # A name out of songs.py, or the melody itself. `songs.find` returns
      # None for anything it does not know, and the library answers None with
      # its "Please enter a valid RTTTL string." message rather than a tune --
      # which is what `play =` in the line below silently catches.
      - key: rtttl_song
        line: |-
          def rtttl_song(text):
              return songs.find(text) or text
    code: "play = rtttl.play(Pin({pin}), rtttl_song({song}))"
    params:
      - {name: pin,  label: Pin, pin: true}
      - {name: song, label: Song, default: Super Mario - Main Theme, align: right}

  # Hand-written: its dropdown is filled from the melodies in the Music tab at
  # the moment the menu opens, and the block carries the notes it plays in a
  # `<mutation>` so that a saved program is the same program anywhere. Neither
  # is something this format can say. See core/block_definitions.js.
  - {label: "Melodies written in the Music tab:"}
  - type: play_melody
    external: true
    params:
      - {name: pin, label: Pin, type: Number, pin: true}

  - {label: "Songs:"}
  - {library: songs}

