# Tones, music notes and RTTTL ringtones on a PWM pin.
#
# Three things were wrong here, all of them the same shape as things earlier
# conversions turned up:
#
# * `tone` and `note` spelled the pin into a Python variable name --
#   `pwm4 = PWM(Pin(4))`, built by stripping the parentheses off the generated
#   code with a JavaScript `.replace()`. That only parses while the pin is a
#   bare literal; plug in anything else and the program does not compile. It is
#   the `init_servo`/`pservo4` bug again. The objects live in a `tone_pwm` dict
#   keyed by the pin now, which keeps the one-PWM-per-pin behaviour and works
#   for any expression.
# * The "(0 for infinite duration)" the block promises was decided in
#   JavaScript, by `parseFloat()` on the *generated code* -- so it only ever
#   held for a literal 0, and any variable duration fell through to the sleep.
#   The same mistake as `dc_motor_direction`. The test is `if <duration> > 0:`
#   in the emitted Python now, so it holds however the duration arrives.
# * Every toolbox shipped the block with a duration of `-1`, which under the
#   old generator meant `time.sleep(-1)` and an immediate `deinit()` -- an
#   inaudible blip. Under the new one it would mean "play forever", which is a
#   bad thing to hand someone who just dragged the block out, so the shipped
#   default is 1 second. `0` still means keep playing, as the block says.
#
# 7 of the 11 toolboxes also named the `pinout` shadow's field `pin` rather
# than `PIN`, which Blockly ignores, so the pin defaulted silently anyway.
#
# `rtttl_play` takes a melody as well as a name now. It passed whatever was in
# the socket to `songs.find`, which answers None for anything outside the 27
# songs in `songs.py`; `rtttl.play` hands None to its parser, gets the string
# "Please enter a valid RTTTL string." back, assigns it to `play` and returns.
# So typing a melody into a block whose own label says RTTTL did nothing at
# all, and said nothing about it. casjengu/BIPES is where that gap showed up:
# its buzzer block takes an RTTTL string, and it is the one thing in those 49
# blocks that is not welded to their own MQTT platform (see BACKLOG.md, B6).

module: machine
colour: 230
url: http://www.bipes.net.br
# Per block rather than per file: the four blocks here share a category, not an
# object, and a program that only plays an RTTTL song has no use for `time` or
# the tone dictionary.
import: []

category:
  name: Sounds
  labels:
    - "Sounds and RTTTL:"
    - "Ring Tone Text Transfer Language (RTTTL) "
    - "Library: "
  library: [rtttl, songs]
  docs: sound
  toolboxes: [3pi_2040, AmadoBoard, esp32, esp32-basic, esp32S2, esp32c3, esp32S3,
              otto-robot, esp8266, makernano, makerpi, rpi_pico, rpi_pico_w]

blocks:
  - type: tone
    label: Tone (Hz)
    footer: "(0 for infinite duration)"
    tooltip: Sound - tone generator
    import: &tone_imports
      - {key: import_pin,  line: "from machine import Pin"}
      - {key: import_pwm,  line: "from machine import PWM"}
      - {key: import_time, line: "import time"}
      - {key: tone_pwm,    line: "tone_pwm = {}"}
    code: |-

      tone_pwm[{pin}] = PWM(Pin({pin}))
      tone_pwm[{pin}].freq({frequency})
      tone_pwm[{pin}].duty_u16(512)
      if {duration} > 0:
          time.sleep({duration})
          tone_pwm[{pin}].deinit()
    params:
      - {name: pin,       label: Pin,             pin: true}
      - {name: frequency, label: Frequency,       type: Number, default: 1200}
      - {name: duration,  label: "Duration (s):", type: Number, default: 1}

  - type: note
    label: Play music note
    footer: "(0 for infinite duration)"
    tooltip: Sound - tone generator (music note)
    import: *tone_imports
    code: |-

      tone_pwm[{pin}] = PWM(Pin({pin}))
      tone_pwm[{pin}].freq({note})
      tone_pwm[{pin}].duty_u16(512)
      if {duration} > 0:
          time.sleep({duration})
          tone_pwm[{pin}].deinit()
    params:
      - {name: pin,      label: Pin, pin: true}
      - {name: note,     label: Note, align: right, plug: {type: tone_type, shadow: true}}
      - {name: duration, label: "Duration (s):", type: Number, default: 1}

  - type: tone_type
    kind: value
    label: []
    tooltip: ""
    url: ""
    code: "{tone}"
    params:
      - name: tone
        label: "Note:"
        kind: dropdown
        options:
