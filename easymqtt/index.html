<!DOCTYPE HTML>
<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author" content="Caio Augusto Silva - BIPES Project">
  <meta name="description" content="EasyMQTT dashboard for data visualization">
  <title>BIPES EasyMQTT</title>
  <style>
  body{
    background-color: #1f2b38;
    font-family: sans-serif;
    margin:0;
  }

  .easymqtt-content{
    padding: 1ex;
  }

  .card{
    margin: 10px;
    box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
    background-color: #fff;
  }

  .card:hover{
    box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
    transition: 0.3s;
  }

  .easymqtt-charts{
    display: flex;
    flex-direction: column;
    flex-wrap: wrap;
    justify-content: center;
  }
  @media only screen and (min-width: 768px) {
    .easymqtt-charts{
      flex-direction: row;
    }
  }

  .easymqtt-config{
    display: flex;
    flex-direction: row;
    font-size:14px;
    flex-wrap: wrap;
    justify-content: space-evenly;
  }

  .easymqtt-config button{
    font-size:14px;
  }

  .easymqtt-config div{
    margin: 10px;
  }

  .easymqtt-chart{
    flex: 1;
    min-width: 280px;
    padding: 8px 10px 10px;
    box-sizing: border-box;
  }

  .easymqtt-chart-title{
    font-size: 15px;
    font-weight: bold;
    text-align: center;
    margin: 4px 0 6px;
  }

  /* Replaces the Highcharts rangeSelector / exporting toolbars. */
  .easymqtt-chart-toolbar{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    margin-bottom: 6px;
  }

  .easymqtt-chart-toolbar .spacer{
    flex: 1;
  }

  .easymqtt-chart-toolbar button{
    font-size: 12px;
    padding: 2px 8px;
    border: 1px solid #c3c9d0;
    border-radius: 3px;
    background: #f3f5f7;
    color: #2b3a4a;
    cursor: pointer;
  }

  .easymqtt-chart-toolbar button:hover{
    background: #e4e8ec;
  }

  .easymqtt-chart-toolbar button.active{
    background: #1f2b38;
    border-color: #1f2b38;
    color: #fff;
  }

  .easymqtt-chart-canvas{
    position: relative;
    height: 360px;
  }

  @media only screen and (min-width: 768px) {
    .easymqtt-chart{
      min-width: 500px;
    }
  }
  .easymqtt-warning{
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    padding: 20px;
  }
  .easymqtt-warning span{
    font-size: 12px;
    font-weight: 400;
  }

  </style>
  <script src="jquery-3.5.1.min.js"></script>
  <!-- Chart.js (MIT), vendored locally so the dashboard makes no third-party
       requests. See lib/LICENSE.* and CHANGELOG.md. -->
  <script src="lib/chart.umd.min.js"></script>
  <script src="lib/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
  <div id="easymqtt-content" class="content easymqtt-content">
    <div id="easymqtt-warning" class="easymqtt-warning card"></div>
    <div id="easymqtt-charts" class="easymqtt-charts"></div>
    <div id="easymqtt-config" class="easymqtt-config card" style="display: none;">
      <div id="easymqtt-config-publish">
        <label for="easymqtt-publish-value">Publish value:</label>
        <input type="number" id="easymqtt-publish-value" name="easymqtt-publish-value" step="0.1" value="0" style="width: 40px;">
        <label for="easymqtt-publish-topic">to topic:</label>
        <input type="text" id="easymqtt-publish-topic" name="easymqtt-publish-topic" style="width: 100px;">
        <button id="easymqtt-publish-submit" type="button" onclick="publishEasyMQTT($('#easymqtt-publish-topic').val(),$('#easymqtt-publish-value').val())">Submit</button>
      </div>
      <div id="easymqtt-config-update">
        <label for="easymqtt-update-freq">Update frequency (s):</label>
        <input type="number" id="easymqtt-update-freq" name="easymqtt-update-freq" min="1" step="1" value="5" style="width: 40px;">
        <button id="easymqtt-update-freq-set" type="button" onclick="setEasyMQTTUpdate($('#easymqtt-update-freq').val())">Set</button>
      </div>
      <div id="easymqtt-config-clear">
        <button id="easymqtt-clear-data" type="button" onclick="clearEasyMQTTSession()">Clear Data</button>
      </div>
    </div>
  </div>
  <script type="text/javascript">
    var timerUpdateEasyMQTT;
    var MQTTCharts = {};
    var easyMQTT_session_chart;

    function getSessionFromURL(){
      let searchParams = new URLSearchParams(window.location.search);
      if (searchParams.has('session')){
        return searchParams.get('session');
      }
      return null;
    }

    // Init
    let urlSession = getSessionFromURL();
    if (urlSession){
      startEasyMQTT(urlSession);
    }else{
      if (parent === window){
        errorEasyMQTT("EasyMQTT Session ID is not currently defined!<br><span>Try passing it as parameter in URL (?session=<session_id>)</span>");
      }else{
          errorEasyMQTT("EasyMQTT Session ID is not currently defined!<br><span>If the EasyMQTT Start block is set try clicking on 'Python' tab first.</span>");
      }
    }

    function startEasyMQTT(session){ 
      if (typeof session === 'undefined'){
        errorEasyMQTT("EasyMQTT Session ID is not currently defined!<br><span>If the EasyMQTT Start block is set try clicking on 'Python' tab first.</span>");
        if (typeof timerUpdateEasyMQTT !== 'undefined')
          cancelTimer(timerUpdateEasyMQTT);
      }else{
        if (easyMQTT_session_chart == session && typeof timerUpdateEasyMQTT !== 'undefined'){
          return;
        }
        if (typeof easyMQTT_session_chart !== 'undefined' && easyMQTT_session_chart != session){
          clearInterval(timerUpdateEasyMQTT);
          resetEasyMQTTCharts();
        } 
        easyMQTT_session_chart = session;
        $("#easymqtt-config").show();
        setEasyMQTTUpdate($('#easymqtt-update-freq').val());
      }
    }

    function resetEasyMQTTCharts(){
      for (topic in MQTTCharts){
        MQTTCharts[topic].destroy();
        delete MQTTCharts[topic];
        $('#easymqtt-'+topic).remove();
      }
    }

    function setEasyMQTTUpdate(interval){
      if (typeof interval === 'undefined' || interval < 0){
        alert("Invalid update interval");
        return;
      }
      clearInterval(timerUpdateEasyMQTT);
      updateEasyMQTTJson();
      timerUpdateEasyMQTT = setInterval(updateEasyMQTTJson,interval*1000);
    }

    function dismissEasyMQTTError(){
      $('#easymqtt-warning').html("");
      $('#easymqtt-warning').hide();
    }

    function errorEasyMQTT(error){
      $('#easymqtt-warning').html(error);
      $('#easymqtt-warning').show();

    }

    function clearEasyMQTTSession(){
      if (confirm("Are you sure you want to clear all data in this topic?\nThis action can not be reverted") == true){
        $.get( `https://bipes.net.br/easymqtt/clearsession.php`,
          {"session": easyMQTT_session_chart}, 
          function( data ) {
            if (data.success){
              resetEasyMQTTCharts();
              errorEasyMQTT(data.result);
            }else{
              errorEasyMQTT(data.result);
            }
          }, "json")
        .fail(function(xhr, status, error){
            errorEasyMQTT("Error clearing session. " + status + " " + error);
          }
        );
      }
    }

    function publishEasyMQTT(topic,value){
      if (typeof topic === 'undefined' || typeof value === 'undefined' || topic.length < 1){
        alert("Invalid input");
        return;
      }
      $.get( `https://bipes.net.br/easymqtt/publish.php`,
        {"session": easyMQTT_session_chart,
         "topic": topic,
         "value": value
        }, 
        function( data ) {
          errorEasyMQTT(data.result);
        }, "json")
      .fail(function(xhr, status, error){
          errorEasyMQTT("Error publising data. " + status + " " + error);
        }
      );
    }

    /* Ranges offered above each chart, mirroring the Highcharts rangeSelector
       this replaced. `ms: null` means "All". */
    const EASYMQTT_RANGES = [
      {text: '1M',  ms: 60 * 1000},
      {text: '5M',  ms: 5 * 60 * 1000},
      {text: '1H',  ms: 60 * 60 * 1000},
      {text: '12H', ms: 12 * 60 * 60 * 1000},
      {text: 'All', ms: null}
    ];

    function easyMQTTDownload(filename, href, revoke){
      let a = document.createElement('a');
      a.href = href;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      if (revoke)
        URL.revokeObjectURL(href);
    }

    /* Wraps a Chart.js line chart with the pieces Highcharts Stock used to
       provide for free: a range selector, PNG export and CSV export. Points are
       held on the dataset as {x: epoch_ms, y: value}. */
    class MqttChart {
      constructor(topic, container){
        this.topic = topic;
        this.rangeMs = null;   // default: All, as rangeSelector.selected = 4 did

        let title = document.createElement('div');
        title.className = 'easymqtt-chart-title';
        title.textContent = 'Live data from ' + topic;

        this.toolbar = document.createElement('div');
        this.toolbar.className = 'easymqtt-chart-toolbar';
        EASYMQTT_RANGES.forEach((range) => {
          let b = document.createElement('button');
          b.type = 'button';
          b.textContent = range.text;
          if (range.ms === this.rangeMs)
            b.className = 'active';
          b.onclick = () => this.setRange(range.ms, b);
          this.toolbar.appendChild(b);
        });

        let spacer = document.createElement('span');
        spacer.className = 'spacer';
        this.toolbar.appendChild(spacer);

        let png = document.createElement('button');
        png.type = 'button';
        png.textContent = 'PNG';
        png.title = 'Download this chart as a PNG image';
        png.onclick = () => this.exportPNG();
        this.toolbar.appendChild(png);

        let csv = document.createElement('button');
        csv.type = 'button';
        csv.textContent = 'CSV';
        csv.title = 'Download this topic\'s data as CSV';
        csv.onclick = () => this.exportCSV();
        this.toolbar.appendChild(csv);

        let canvasBox = document.createElement('div');
        canvasBox.className = 'easymqtt-chart-canvas';
        let canvas = document.createElement('canvas');
        canvasBox.appendChild(canvas);

        container.appendChild(title);
        container.appendChild(this.toolbar);
        container.appendChild(canvasBox);

        this.chart = new Chart(canvas.getContext('2d'), {
          type: 'line',
          data: {
            datasets: [{
              label: topic,
              data: [],
              borderColor: '#2a6ebb',
              backgroundColor: '#2a6ebb',
              borderWidth: 2,
              pointRadius: 2,
              tension: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            parsing: false,
            normalized: true,
            interaction: {mode: 'nearest', intersect: false},
            plugins: {legend: {display: false}},
            scales: {
              x: {
                type: 'time',
                time: {tooltipFormat: 'yyyy-MM-dd HH:mm:ss'}
              },
              y: {
                title: {display: true, text: 'Value'}
              }
            }
          }
        });
      }

      get points(){
        return this.chart.data.datasets[0].data;
      }

      /* Epoch ms of the newest sample, or null when there is no data yet. */
      get lastX(){
        let p = this.points;
        return p.length ? p[p.length - 1].x : null;
      }

      addPoint(timestampMs, value){
        this.points.push({x: timestampMs, y: value});
      }

      setRange(ms, button){
        this.rangeMs = ms;
        Array.from(this.toolbar.querySelectorAll('button')).forEach(
          (b) => b.classList.remove('active'));
        if (button)
          button.classList.add('active');
        this.redraw();
      }

      /* Highcharts scrolled the visible window to the newest data; reproduce
         that by pinning the axis to [last - range, last]. */
      redraw(){
        let x = this.chart.options.scales.x;
        let last = this.lastX;
        if (this.rangeMs === null || last === null){
          delete x.min;
          delete x.max;
        }else{
          x.min = last - this.rangeMs;
          x.max = last;
        }
        this.chart.update('none');
      }

      reflow(){
        this.chart.resize();
      }

      destroy(){
        this.chart.destroy();
      }

      exportPNG(){
        easyMQTTDownload(this.topic + '.png', this.chart.toBase64Image(), false);
      }

      exportCSV(){
        let rows = ['timestamp,datetime,' + JSON.stringify(this.topic)];
        this.points.forEach((p) => {
          rows.push([Math.round(p.x / 1000),
                     JSON.stringify(new Date(p.x).toISOString()),
                     p.y].join(','));
        });
        let blob = new Blob([rows.join('\n')], {type: 'text/csv;charset=utf-8'});
        easyMQTTDownload(this.topic + '.csv', URL.createObjectURL(blob), true);
      }
    }

    function addNewChart(topic){
      MQTTCharts[topic] = new MqttChart(
        topic, document.getElementById('easymqtt-' + topic));
    }

    function updateEasyMQTTTopic(topic,since=0){
      $.get( `https://bipes.net.br/easymqtt/gettopic.php`,
        {"session": easyMQTT_session_chart, "topic": topic, "since": since}, 
        function( data ) {
          if (data.success){
            if (data.result.length > 0){
              if (!(topic in MQTTCharts)){
                $("#easymqtt-charts").append('<div id="easymqtt-'+topic+'" class="easymqtt-chart card"></div>')
                addNewChart(topic);
                for (i in MQTTCharts){
                  MQTTCharts[i].reflow();
                }
              }
              for (i in data.result){
                MQTTCharts[topic].addPoint(data.result[i].timestamp*1000,parseFloat(data.result[i].data));
              }
              MQTTCharts[topic].redraw();
            }
          }else{
            errorEasyMQTT(data.result);
          }
        }, "json")
      .fail(function(xhr, status, error){
          errorEasyMQTT(topic + " request error. " + status + " " + error);
        }
      );
    }
    function updateEasyMQTTJson(){
      $.get( `https://bipes.net.br/easymqtt/getsession.php`,
      {"session": easyMQTT_session_chart}, 
      function( data ) {
        if (data.success){
          dismissEasyMQTTError();
          for (i in data.result){
            if (data.result[i] in MQTTCharts){
              let last_update = MQTTCharts[data.result[i]].lastX / 1000;
              updateEasyMQTTTopic(data.result[i],last_update + 1);
            }else{
              updateEasyMQTTTopic(data.result[i]);
            }
          }
        }else{
          errorEasyMQTT(data.result);
        }
      }, "json" )
      .fail(function(xhr, status, error){
          errorEasyMQTT("Session" + session + " request error. " + status + " " + error);
        }
      );
    }
  </script>
</body>
</html>
